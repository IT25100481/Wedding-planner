<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Admin | Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c9a84c; --gold-dark: #9a7a2e; --cream: #fdf8f2; --dark: #1a1209; --text-muted: #7a6a50; }
        body { background: var(--cream); font-family: 'Montserrat', sans-serif; font-weight: 300; }
        .navbar { background: var(--dark); padding: 16px 40px; }
        .navbar-brand { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; color: var(--gold) !important; letter-spacing: 3px; }
        .nav-link { color: rgba(255,255,255,0.75) !important; font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; }
        .nav-link:hover { color: var(--gold) !important; }
        .btn-logout { background: transparent; border: 1px solid rgba(201,168,76,0.5); color: var(--gold); font-size: 0.68rem; letter-spacing: 2px; text-transform: uppercase; padding: 6px 16px; border-radius: 0; text-decoration: none; }
        .main { padding: 50px 80px; max-width: 600px; margin: 0 auto; }
        .page-tag { font-size: 0.62rem; letter-spacing: 5px; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
        .page-title { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 300; color: var(--dark); margin-bottom: 32px; }
        .panel { background: #fff; border: 1px solid rgba(201,168,76,0.2); padding: 36px; }
        .form-label { font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); }
        .form-control { border-radius: 0; border: 1px solid rgba(201,168,76,0.3); font-size: 0.85rem; }
        .form-control:focus { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(201,168,76,0.15); }
        .btn-gold { background: var(--gold); color: var(--dark); font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; padding: 12px 28px; border-radius: 0; border: none; font-weight: 500; }
        .btn-gold:hover { background: var(--gold-dark); color: #fff; }
        .btn-back { font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; padding: 12px 28px; border-radius: 0; border: 1px solid rgba(201,168,76,0.4); background: transparent; color: var(--text-muted); text-decoration: none; }
        @media (max-width: 768px) { .main { padding: 30px 20px; } .navbar { padding: 14px 20px; } }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
    <a class="navbar-brand" href="/admin/dashboard">✦ Admin Panel</a>
    <div class="d-flex gap-4 ms-4">
        <a class="nav-link" href="/admin/dashboard">Dashboard</a>
        <a class="nav-link" href="/admin/vendors">Vendors</a>
        <a class="nav-link" href="/admin/admins">Admins</a>
    </div>
    <div class="ms-auto">
        <a href="/admin/logout" class="btn-logout">Logout</a>
    </div>
</nav>

<!-- MAIN -->
<div class="main">
    <div class="page-tag">Admin Panel</div>
    <div class="page-title">Add / Edit Admin</div>

    <div class="panel">
        <form th:action="@{/admin/admins/save}" th:object="${admin}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" th:field="*{username}" placeholder="Enter username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" th:field="*{email}" placeholder="Enter email" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" th:field="*{password}" placeholder="Enter password" required>
            </div>
            <div class="d-flex gap-3 mt-4">
                <a href="/admin/admins" class="btn-back">Cancel</a>
                <button type="submit" class="btn-gold">Save Admin</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
