<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivaha | Category Selection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold-light: #E5B27D; --dark-chocolate: #1A1209; --white-alpha: rgba(255, 255, 255, 0.1); }
        body { background-color: var(--dark-chocolate); color: white; font-family: 'Montserrat', sans-serif; margin: 0; }
        .navbar { background: rgba(26, 18, 9, 0.98); border-bottom: 1px solid var(--white-alpha); padding: 15px 5%; }
        .brand-text { font-family: "Cormorant Garamond", serif; font-size: 2.2rem; color: var(--gold-light); letter-spacing: 2px; }
        .section-title { font-family: 'Cormorant Garamond', serif; font-size: 3.5rem; text-align: center; margin: 50px 0; font-weight: 300; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 35px; padding: 0 5% 50px 5%; }
        .luxury-card { background: #231A11; border: 1px solid var(--white-alpha); transition: 0.5s; min-height: 450px; position: relative; overflow: hidden; }
        .luxury-card:hover { border-color: var(--gold-light); transform: translateY(-8px); }
        .card-image-header { height: 260px; background-size: cover; background-position: center; border-bottom: 1px solid var(--white-alpha); }
        .card-body-content { padding: 30px; display: flex; flex-direction: column; height: 100%; }
        .card-name-title { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; margin-bottom: 10px; color: white; font-weight: 300; }
        .btn-luxury-gold { background: var(--gold-light); color: var(--dark-chocolate); border: none; padding: 14px 25px; font-weight: 600; letter-spacing: 2px; font-size: 0.75rem; text-transform: uppercase; width: 100%; margin-top: auto; }
        .btn-luxury-gold:hover { background: white; }
        .text-gold { color: var(--gold-light); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid">
        <a href="/vendors" class="brand-text text-decoration-none">Vivaha</a>
        <a href="/vendors" class="btn btn-outline-light btn-sm px-4 rounded-0">BACK TO HUB</a>
    </div>
</nav>

<h2 class="section-title">Premium <span class="text-gold" th:text="${categoryName}">CATEGORY</span> Selection</h2>

<div class="grid-container">
    <div th:each="v : ${allVendors}" class="luxury-card shadow-lg">

        <div th:id="'front-' + ${v.id}">
            <div class="card-image-header" th:style="|background-image: url(/uploads/${v.imagePath});|"></div>
            <div class="card-body-content">
                <h3 class="card-name-title" th:text="${v.businessName}">BUSINESS NAME</h3>
                <p class="small text-white-50" th:text="${v.price + ' LKR'}"></p>
                <button class="btn btn-outline-light w-100 rounded-0 btn-sm mt-4 py-2"
                        th:data-id="${v.id}"
                        onclick="toggleDetails(this.getAttribute('data-id'))">VIEW DETAILS</button>
            </div>
        </div>

        <div th:id="'back-' + ${v.id}" class="card-body-content" style="display: none; background: #1f160d;">
            <button class="btn btn-link text-gold p-0 mb-4 text-decoration-none small d-flex align-items-center"
                    th:data-id="${v.id}"
                    onclick="toggleDetails(this.getAttribute('data-id'))">
                <i class="bi bi-arrow-left me-2"></i> BACK
            </button>

            <h2 class="card-name-title text-gold" th:text="${v.businessName}"></h2>
            <p class="small text-white-50 mb-4" th:text="${v.description}"></p>

            <div class="mt-auto">
                <p class="small mb-2"><i class="bi bi-telephone text-gold me-2"></i> <span th:text="${v.contact}"></span></p>
                <p class="small mb-4"><i class="bi bi-cash-stack text-gold me-2"></i> <span th:text="${v.price}"></span> LKR</p>
                <button class="btn-luxury-gold">INQUIRE NOW</button>
            </div>
        </div>
    </div>
</div>

<div th:if="${#lists.isEmpty(allVendors)}" class="text-center py-5">
    <p class="text-white-50">No approved vendors available in this category yet.</p>
    <a href="/vendors" class="text-gold">Return to Essentials</a>
</div>

<script>
    function toggleDetails(id) {
        const f = document.getElementById('front-' + id);
        const b = document.getElementById('back-' + id);
        if(f && b) {
            f.style.display = (f.style.display === 'none') ? 'block' : 'none';
            b.style.display = (b.style.display === 'none') ? 'block' : 'none';
        }
    }
</script>

</body>
</html>
