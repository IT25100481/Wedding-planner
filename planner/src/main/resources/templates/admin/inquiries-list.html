<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - All Inquiries</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { background-color: #140e08; color: #ffffff; padding: 40px; font-family: 'Montserrat', sans-serif; }
        h2 { color: #c9a84c; font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; letter-spacing: 1px; }
        .table { background-color: #1a130b; border: 1px solid #2a2015; color: #ffffff; font-size: 0.85rem; }
        .table th { color: #c9a84c; font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; padding: 15px; border-bottom: 2px solid #c9a84c; }
        .table td { padding: 15px; vertical-align: middle; color: rgba(255,255,255,0.85); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .btn-reply { border: 1px solid #c9a84c; color: #c9a84c; padding: 6px 16px; text-decoration: none; display: inline-block; font-size: 0.72rem; letter-spacing: 1px; text-transform: uppercase; transition: 0.3s; }
        .btn-reply:hover { background-color: #c9a84c; color: #140e08; }
        .badge-couple { background-color: rgba(40, 167, 69, 0.15); color: #86efac; padding: 4px 10px; font-size: 11px; font-weight: bold; letter-spacing: 1px; border: 1px solid rgba(40, 167, 69, 0.3); }
        .badge-vendor { background-color: rgba(0, 123, 255, 0.15); color: #93c5fd; padding: 4px 10px; font-size: 11px; font-weight: bold; letter-spacing: 1px; border: 1px solid rgba(0, 123, 255, 0.3); }
        .badge-guest { background-color: rgba(108, 117, 125, 0.15); color: #cbd5e1; padding: 4px 10px; font-size: 11px; font-weight: bold; letter-spacing: 1px; border: 1px solid rgba(108, 117, 125, 0.3); }
        .empty-state { text-align: center; padding: 60px; border: 1px dashed rgba(201, 168, 76, 0.2); color: rgba(255,255,255,0.4); }
    </style>
</head>
<body>
<div class="container">
    <h2 class="mb-4">Master Inquiry Registry (All Submissions)</h2>

    <table class="table table-dark table-striped mt-4" th:if="${allInquiries != null and !#lists.isEmpty(allInquiries)}">
        <thead>
        <tr>
            <th>Customer Name</th>
            <th>Email Address</th>
            <th>Contact No</th>
            <th>Sender Type</th>
            <th>Target Assignment</th>
            <th>Message Context</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="inq : ${allInquiries}">
            <td th:text="${inq.customerName}" style="font-weight: 600;">Name</td>
            <td th:text="${inq.customerEmail}" style="font-family: monospace; color: rgba(255,255,255,0.6);">Email</td>
            <td th:text="${inq.contactNo}">Contact</td>
            <td>
                <span th:if="${inq.userRole != null && #strings.toLowerCase(inq.userRole) == 'couple'}" class="badge-couple">COUPLE</span>
                <span th:if="${inq.userRole != null && #strings.toLowerCase(inq.userRole) == 'vendor'}" class="badge-vendor">VENDOR</span>
                <span th:if="${inq.userRole == null || (#strings.toLowerCase(inq.userRole) != 'couple' && #strings.toLowerCase(inq.userRole) != 'vendor')}" class="badge-guest">GUEST</span>
            </td>
            <td th:text="${inq.vendorName}" style="color: #c9a84c; font-style: italic;">General Inquiry</td>
            <td th:text="${inq.message}" style="max-width: 350px; line-height: 1.5;">Message</td>
            <td>
                <a th:href="'https://mail.google.com/mail/?view=cm&fs=1&to=' + ${inq.customerEmail}" target="_blank" class="btn-reply">
                    <i class="bi bi-envelope-fill me-1"></i> Reply
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="empty-state mt-4" th:if="${allInquiries == null or #lists.isEmpty(allInquiries)}">
        <i class="bi bi-inbox mb-3 d-block" style="font-size: 2rem; color: rgba(201, 168, 76, 0.3);"></i>
        <p class="mb-0">No client inquiries have been recorded in the archive logs yet.</p>
    </div>
</div>
</body>
</html>
