<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - All Inquiries</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #140e08; color: #ffffff; padding: 40px; }
        h2 { color: #c9a84c; font-family: 'Georgia', serif; }
        .table { background-color: #1a130b; border: 1px solid #2a2015; color: #ffffff; }
        .table th { color: #c9a84c; }
        .btn-reply { border: 1px solid #c9a84c; color: #c9a84c; padding: 5px 15px; text-decoration: none; }
        .btn-reply:hover { background-color: #c9a84c; color: #140e08; }
        .badge-couple { background-color: #28a745; color: white; padding: 5px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-vendor { background-color: #007bff; color: white; padding: 5px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-guest { background-color: #6c757d; color: white; padding: 5px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h2>Master Inquiry Registry (All Submissions)</h2>

    <table class="table table-dark table-striped mt-4">
        <thead>
        <tr>
            <th>Customer Name</th>
            <th>Email</th>
            <th>Contact No</th>
            <th>Sender Type</th>
            <th>Message</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="inq : ${allInquiries}">
            <td th:text="${inq.customerName}">Name</td>
            <td th:text="${inq.customerEmail}">Email</td>
            <td th:text="${inq.contactNo}">Contact</td>
            <td>
                <span th:if="${inq.userRole != null && #strings.toLowerCase(inq.userRole) == 'couple'}" class="badge-couple">COUPLE</span>
                <span th:if="${inq.userRole != null && #strings.toLowerCase(inq.userRole) == 'vendor'}" class="badge-vendor">VENDOR</span>
                <span th:if="${inq.userRole == null || (#strings.toLowerCase(inq.userRole) != 'couple' && #strings.toLowerCase(inq.userRole) != 'vendor')}" class="badge-guest">GUEST</span>
            </td>
            <td th:text="${inq.message}">Message</td>
            <td>
                <a th:href="'https://mail.google.com/mail/?view=cm&fs=1&to=' + ${inq.customerEmail}" target="_blank" class="btn-reply">Reply via Gmail</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
