<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiries List | Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c9a84c; --cream: #fdf8f2; --dark: #1a1209; }
        body { background: var(--cream); font-family: 'Montserrat', sans-serif; padding: 40px; color: var(--dark); }

        .page-title { font-family: 'Cormorant Garamond', serif; font-size: 2.8rem; margin-bottom: 30px; border-bottom: 1px solid rgba(201,168,76,0.3); padding-bottom: 10px; }
        .table-container { background: white; padding: 30px; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid rgba(201,168,76,0.1); }

        .table thead { background: var(--dark); color: var(--gold); }
        .table th { font-weight: 500; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; padding: 15px; border: none; }
        .table td { padding: 20px 15px; vertical-align: middle; font-size: 0.9rem; border-bottom: 1px solid #f2f2f2; }

        .status-badge { background: #fcf1d4; color: #b08d2b; padding: 5px 12px; font-size: 0.65rem; font-weight: 600; border-radius: 2px; text-transform: uppercase; border: 1px solid rgba(201,168,76,0.2); }

        .btn-reply {
            background: var(--dark); color: var(--gold); border: 1px solid var(--gold); padding: 8px 18px;
            font-size: 0.7rem; font-weight: 500; text-transform: uppercase;
            letter-spacing: 1px; text-decoration: none; transition: 0.3s;
            display: inline-block;
        }
        .btn-reply:hover { background: var(--gold); color: white; }

        .btn-back { border: 1px solid var(--gold); color: var(--gold); padding: 8px 20px; text-decoration: none; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .btn-back:hover { background: var(--dark); border-color: var(--dark); color: white; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h1 class="page-title">Client Inquiries</h1>
        <a href="/admin/dashboard" class="btn-back">← Back to Dashboard</a>
    </div>

    <div class="table-container">
        <table class="table">
            <thead>
            <tr>
                <th>Status</th>
                <th>User Email</th>
                <th>Name</th>
                <th>Wedding Date</th>
                <th>Message</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="inquiry : ${allInquiries}">
                <td><span class="status-badge">Pending</span></td>
                <td th:text="${inquiry.customerEmail}" style="font-weight: 500; color: #1a1209;"></td>
                <td th:text="${inquiry.customerName}"></td>
                <td th:text="${inquiry.weddingDate}"></td>
                <td th:text="${inquiry.message}" class="text-muted" style="font-style: italic; font-size: 0.85rem;"></td>
                <td>
                    <a th:href="'https://mail.google.com/mail/?view=cm&fs=1&to=' + ${inquiry.customerEmail} + '&su=Regarding Your Wedding Inquiry&body=Dear ' + ${inquiry.customerName} + ','"
                       target="_blank"
                       class="btn-reply">
                        REPLY VIA GMAIL
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(allInquiries)}">
                <td colspan="6" class="text-center py-5 text-muted">No inquiries found in the system.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
