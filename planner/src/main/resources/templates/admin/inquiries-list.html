<div class="container mt-5">
    <h2 class="gold-italic">Client Inquiries</h2>
    <table class="table table-dark table-hover mt-4">
        <thead>
        <tr>
            <th>User Email</th>
            <th>Customer Name</th>
            <th>Contact</th>
            <th>Wedding Date</th>
            <th>Message</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="inq : ${allInquiries}">
            <td th:text="${inq.customerEmail}"></td>
            <td th:text="${inq.customerName}"></td>
            <td th:text="${inq.contactNo}"></td>
            <td th:text="${inq.weddingDate}"></td>
            <td th:text="${inq.message}"></td>
        </tr>
        </tbody>
    </table>
</div>
