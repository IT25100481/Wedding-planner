<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Wedding Planner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #c9a84c; --dark: #1a1209; --cream: #fdf8f2; --text-muted: #7a6a50; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        background: var(--dark);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Montserrat', sans-serif;
    }
    .login-card {
        background: var(--cream);
        width: 100%;
        max-width: 420px;
        padding: 48px;
    }
    .login-tag {
        font-size: 0.62rem;
        letter-spacing: 5px;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 10px;
    }
    .login-title {
        font-family: 'Cormorant Garamond', serif;
        font-size: 2.2rem;
        font-weight: 300;
        color: var(--dark);
        margin-bottom: 32px;
    }
    .form-label {
        font-size: 0.65rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text-muted);
    }
    .form-control {
        border-radius: 0;
        border: 1px solid rgba(201,168,76,0.3);
        font-size: 0.85rem;
        padding: 12px 14px;
    }
    .form-control:focus {
        border-color: var(--gold);
        box-shadow: 0 0 0 2px rgba(201,168,76,0.15);
    }
    .btn-login {
        width: 100%;
        background: var(--dark);
        color: #fff;
        border: none;
        padding: 14px;
        font-size: 0.72rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        border-radius: 0;
        margin-top: 8px;
        cursor: pointer;
        transition: all 0.3s;
    }
    .btn-login:hover { background: var(--gold); color: var(--dark); }
    .alert-error {
        background: #fef2f2;
        border: 1px solid #fca5a5;
        color: #991b1b;
        padding: 12px 16px;
        font-size: 0.8rem;
        margin-bottom: 20px;
    }
    .back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        font-size: 0.75rem;
        color: var(--text-muted);
        text-decoration: none;
    }
    .back-link:hover { color: var(--gold); }
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-tag">Admin Panel</div>
  <div class="login-title">Admin Login</div>

  <!-- ERROR MESSAGE -->
  <div th:if="${error}" class="alert-error" th:text="${error}"></div>

  <form th:action="@{/admin/login}" method="post">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" class="form-control" name="username" placeholder="Enter username" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" name="password" placeholder="Enter password" required>
    </div>
    <button type="submit" class="btn-login">Sign In</button>
  </form>

  <a href="/" class="back-link">← Back to Website</a>
</div>
</body>
</html>
