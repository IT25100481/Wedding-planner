<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Our Vendors | Vivaha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #E5B27D; --dark: #1A1209; }
        body { background: var(--dark); color: white; font-family: 'Montserrat', sans-serif; }
        .filter-bar { padding: 120px 5% 30px; background: #231A11; border-bottom: 1px solid rgba(229,178,125,0.2); }
        .vendor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; padding: 50px 5%; }
        .v-card { background: #231A11; border: 1px solid rgba(255,255,255,0.1); transition: 0.4s; cursor: pointer; }
        .v-card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .v-img { height: 220px; background-size: cover; background-position: center; }
        select { background: transparent; color: white; border: 1px solid var(--gold); padding: 8px; margin-right: 10px; }
        .modal-content { background: var(--dark); border: 1px solid var(--gold); color: white; border-radius: 0; }
    </style>
</head>
<body>

<section class="filter-bar">
    <h1 style="font-family: 'Cormorant Garamond'; color: var(--gold); font-size: 3rem;">Exquisite Vendors</h1>
    <form action="/vendors" method="get" class="mt-4">
        <select name="category">
            <option value="">All Categories</option>
            <option value="Photography">Photography</option>
            <option value="Cakes">Cakes</option>
            <option value="Venue">Venue</option>
        </select>
        <select name="tradition">
            <option value="">All Traditions</option>
            <option value="Sinhalese">Sinhalese</option>
            <option value="Hindu">Hindu</option>
            <option value="Muslim">Muslim</option>
            <option value="Christian">Christian</option>
        </select>
        <button type="submit" style="background: var(--gold); border: none; padding: 8px 20px;">FILTER</button>
    </form>
</section>

<div class="vendor-grid">
    <!-- FIX: removed th:onclick with string interpolation, use data-* attributes instead -->
    <div th:each="s : ${services}" class="v-card"
         th:data-name="${s.businessName}"
         th:data-desc="${s.description}"
         th:data-price="${s.price}"
         th:data-contact="${s.contact}"
         th:data-tradition="${s.tradition}"
         onclick="showPopup(this)">
        <div class="v-img" th:style="'background-image: url(/uploads/' + ${s.imagePath} + ');'"></div>
        <div class="p-4">
            <span style="color: var(--gold); font-size: 0.7rem; letter-spacing: 2px;" th:text="${s.category}"></span>
            <h3 style="font-family: 'Cormorant Garamond'; font-size: 1.8rem;" th:text="${s.businessName}"></h3>
            <p style="color: var(--gold);" th:text="${s.price} + ' LKR'"></p>
        </div>
    </div>
</div>

<!-- Details Modal -->
<div class="modal fade" id="vendorModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4">
            <h2 id="p-name" style="font-family: 'Cormorant Garamond'; color: var(--gold);"></h2>
            <p id="p-desc" style="font-size: 0.9rem; opacity: 0.8;"></p>
            <hr style="border-color: rgba(229,178,125,0.3);">
            <p><strong>Tradition:</strong> <span id="p-trad"></span></p>
            <p><strong>Contact:</strong> <span id="p-contact"></span></p>
            <h3 id="p-price" style="color: var(--gold);"></h3>
            <button type="button" class="btn btn-outline-light w-100 mt-3" data-bs-dismiss="modal">CLOSE</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function showPopup(card) {
        document.getElementById('p-name').innerText    = card.getAttribute('data-name');
        document.getElementById('p-desc').innerText    = card.getAttribute('data-desc');
        document.getElementById('p-price').innerText   = card.getAttribute('data-price') + ' LKR';
        document.getElementById('p-contact').innerText = card.getAttribute('data-contact');
        document.getElementById('p-trad').innerText    = card.getAttribute('data-tradition');
        new bootstrap.Modal(document.getElementById('vendorModal')).show();
    }
</script>
</body>
</html>
