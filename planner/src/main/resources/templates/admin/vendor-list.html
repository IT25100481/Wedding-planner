<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor List | Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c9a84c; --gold-dark: #9a7a2e; --cream: #fdf8f2; --dark: #1a1209; --text-muted: #7a6a50; }
        body { background: var(--cream); font-family: 'Montserrat', sans-serif; font-weight: 300; }
        .navbar { background: var(--dark); padding: 16px 40px; }
        .navbar-brand { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; color: var(--gold) !important; letter-spacing: 3px; }
        .nav-link { color: rgba(255,255,255,0.75) !important; font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; }
        .nav-link:hover { color: var(--gold) !important; }
        .btn-logout { background: transparent; border: 1px solid rgba(201,168,76,0.5); color: var(--gold); font-size: 0.68rem; letter-spacing: 2px; text-transform: uppercase; padding: 6px 16px; border-radius: 0; text-decoration: none; }
        .main { padding: 50px 80px; }
        .page-tag { font-size: 0.62rem; letter-spacing: 5px; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
        .page-title { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 300; color: var(--dark); margin-bottom: 40px; }
        .panel { background: #fff; border: 1px solid rgba(201,168,76,0.2); padding: 32px; }
        .form-label { font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); }
        table { width: 100%; border-collapse: collapse; }
        th { font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); padding: 12px 16px; border-bottom: 2px solid rgba(201,168,76,0.2); text-align: left; }
        td { font-size: 0.82rem; padding: 14px 16px; border-bottom: 1px solid rgba(201,168,76,0.1); color: var(--dark); }
        tr:hover td { background: rgba(201,168,76,0.04); }
        .status-PENDING { background: rgba(255,193,7,0.15); color: #856404; font-size: 0.62rem; letter-spacing: 2px; text-transform: uppercase; padding: 3px 10px; display: inline-block; }
        .status-APPROVED { background: rgba(25,135,84,0.15); color: #0a3622; font-size: 0.62rem; letter-spacing: 2px; text-transform: uppercase; padding: 3px 10px; display: inline-block; }
        .btn-approve { font-size: 0.65rem; letter-spacing: 1px; text-transform: uppercase; padding: 5px 14px; background: var(--gold); color: var(--dark); border: none; border-radius: 0; cursor: pointer; }
        .btn-approve:hover { background: var(--gold-dark); color: #fff; }
        .empty-state { text-align: center; padding: 50px; color: var(--text-muted); }
        .alert-success-custom { background: #f0fdf4; border: 1px solid #86efac; color: #166534; padding: 12px 16px; font-size: 0.82rem; margin-bottom: 20px; }
        @media (max-width: 768px) { .main { padding: 30px 20px; } .navbar { padding: 14px 20px; } }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
    <a class="navbar-brand" href="/admin/dashboard">✦ Admin Panel</a>
    <div class="d-flex gap-4 ms-4">
        <a class="nav-link" href="/admin/dashboard">Dashboard</a>
        <a class="nav-link" href="/admin/vendors">Vendors</a>
        <a class="nav-link" href="/admin/admins">Admins</a>
        <a class="nav-link" th:href="@{/admin/inquiries}">Inquiries</a>
    </div>
    <div class="ms-auto">
        <a href="/admin/logout" class="btn-logout">Logout</a>
    </div>
</nav>

<!-- MAIN -->
<div class="main">
    <div class="page-tag">Admin Panel</div>
    <div class="page-title">Vendor Management</div>

    <!-- SUCCESS MESSAGE -->
    <div th:if="${message}" class="alert-success-custom" th:text="${message}"></div>

    <div class="panel">
        <div th:if="${not #lists.isEmpty(vendors)}">
            <table>
                <thead>
                <tr>
                    //Vendor list
                    <th>Business Name</th>
                    <th>Category</th>
                    <th>Tradition</th>
                    <th>Price</th>
                    <th>Contact</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="vendor : ${vendors}">
                    <td th:text="${vendor.businessName}"></td>
                    <td th:text="${vendor.category}"></td>
                    <td th:text="${vendor.tradition}"></td>
                    <td th:text="${vendor.price + ' LKR'}"></td>
                    <td th:text="${vendor.contact}"></td>
                    <td>
                        <span th:class="'status-' + ${vendor.status}" th:text="${vendor.status}"></span>
                    </td>
                    <td>
                        <form th:if="${vendor.status == 'PENDING'}"
                              th:action="@{/admin/vendors/approve/{id}(id=${vendor.id})}"
                              method="post" style="display:inline;">
                            <button type="submit" class="btn-approve">Approve</button>
                        </form>
                        <span th:if="${vendor.status == 'APPROVED'}" style="font-size:0.75rem;color:#0a3622;">✓ Approved</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="empty-state" th:if="${#lists.isEmpty(vendors)}">
            <div style="font-size:2rem;">🏪</div>
            <div style="font-family:'Cormorant Garamond',serif;font-size:1.6rem;margin:12px 0;">No Vendors Yet</div>
            <div>Vendors will appear here once they register.</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
