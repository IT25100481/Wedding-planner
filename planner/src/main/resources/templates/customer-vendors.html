<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivaha | Your Wedding Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold-light: #E5B27D; --dark-chocolate: #1A1209; --white-alpha: rgba(255, 255, 255, 0.1); }
        body { background-color: var(--dark-chocolate); color: white; font-family: 'Montserrat', sans-serif; }
        .brand-text { font-family: "Cormorant Garamond", serif; font-size: 2.2rem; color: var(--gold-light); letter-spacing: 2px; }
        .filter-bar { background: #231A11; padding: 12px 5%; border-bottom: 1px solid var(--white-alpha); display: flex; justify-content: space-between; align-items: center; }
        .luxury-card { background: #231A11; border: 1px solid var(--white-alpha); transition: 0.5s; position: relative; cursor: pointer; }
        .luxury-card:hover { border-color: var(--gold-light); transform: translateY(-8px); }
        .section-title { font-family: 'Cormorant Garamond', serif; font-size: 3rem; text-align: center; margin: 60px 0 30px; font-weight: 300; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 35px; padding: 20px 5%; }
        .btn-luxury-gold { background: var(--gold-light); color: var(--dark-chocolate); border: none; padding: 14px; font-weight: 600; text-transform: uppercase; width: 100%; }
        .hidden { display: none !important; }
        .card-image-header { height: 240px; background-size: cover; background-position: center; border-bottom: 1px solid var(--white-alpha); }
        .floating-bucket { position: fixed; bottom: 30px; right: 30px; background: var(--gold-light); color: var(--dark-chocolate); width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; z-index: 1000; }
        .details-panel { display: none; background: #1f160d; padding: 20px; }
    </style>
</head>
<body>

<nav class="navbar p-3 border-bottom border-secondary">
    <div class="container-fluid"><a href="/" class="brand-text text-decoration-none">Vivaha</a></div>
</nav>

<div class="filter-bar">
    <span class="small text-uppercase" style="color: var(--gold-light);">WEDDING TRADITION FILTER</span>
    <form action="/vendors" method="get">
        <select name="style" onchange="this.form.submit()" style="background:transparent; color:var(--gold-light); border:1px solid var(--gold-light);">
            <option value="Mixed">ALL STYLES</option>
            <option value="Sinhalese">SINHALESE</option>
            <option value="Hindu">HINDU</option>
            <option value="Muslim">MUSLIM</option>
            <option value="Christian">CHRISTIAN</option>
        </select>
    </form>
</div>

<h2 class="section-title">The <span style="color: var(--gold-light)">Essentials</span></h2>
<div class="grid-container">
    <div class="luxury-card p-4 text-center" onclick="filterCategory('Cakes')"><h3 style="font-family: 'Cormorant Garamond';">CAKES</h3><button class="btn-luxury-gold mt-3">VIEW</button></div>
    <div class="luxury-card p-4 text-center" onclick="filterCategory('Photography')"><h3 style="font-family: 'Cormorant Garamond';">PHOTOGRAPHY</h3><button class="btn-luxury-gold mt-3">VIEW</button></div>
    <div class="luxury-card p-4 text-center" onclick="filterCategory('Venue')"><h3 style="font-family: 'Cormorant Garamond';">VENUES</h3><button class="btn-luxury-gold mt-3">VIEW</button></div>
</div>

<div id="vendor-section" class="hidden">
    <h2 class="section-title">Available <span id="cat-label" style="color: var(--gold-light)">Selection</span></h2>
    <div class="grid-container" id="vendor-grid">
        <div th:each="v : ${allVendors}" class="luxury-card vendor-item"
             th:data-category="${v.category}"
             th:data-tradition="${v.tradition}">
            <div class="card-image-header" th:style="'background-image: url(/uploads/' + ${v.imagePath} + ');'"></div>
            <div class="p-4">
                <h3 th:text="${v.businessName}" style="font-family: 'Cormorant Garamond'; font-size: 1.8rem;"></h3>
                <p class="small text-white-50" th:text="${v.price + ' LKR'}"></p>
                <div class="d-flex gap-2">
                    <!-- FIX: use data-id + read via getAttribute instead of th:onclick with string -->
                    <button class="btn btn-outline-light w-100 rounded-0"
                            th:data-id="${v.id}"
                            onclick="toggleDetails(this.getAttribute('data-id'))">DETAILS</button>
                    <button class="btn-luxury-gold w-100"
                            th:data-id="${v.id}"
                            th:data-name="${v.businessName}"
                            th:data-price="${v.price}"
                            onclick="handleBooking(this)">+ BUCKET</button>
                </div>
                <button class="btn btn-outline-warning w-100 mt-2 rounded-0 small"
                        th:data-vendor-id="${v.id}"
                        onclick="handleInquiry(this.getAttribute('data-vendor-id'))">INQUIRY</button>
            </div>
            <!-- Details panel toggled by toggleDetails() -->
            <div th:id="'details-' + ${v.id}" class="details-panel">
                <p class="small text-white-50" th:text="${v.description}"></p>
                <p class="small"><i class="bi bi-telephone"></i> <span th:text="${v.contact}"></span></p>
            </div>
        </div>
    </div>
</div>

<div class="floating-bucket" onclick="openBucket()">
    <i class="bi bi-bag-heart"></i>
    <span id="bucket-count" class="badge bg-white text-dark rounded-circle" style="position:absolute; top:5px; right:5px;">0</span>
</div>

<script>
    let bucket = JSON.parse(sessionStorage.getItem('vivaha_bucket')) || [];

    function filterCategory(cat) {
        document.getElementById('vendor-section').classList.remove('hidden');
        document.getElementById('cat-label').innerText = cat.toUpperCase();
        const items = document.querySelectorAll('.vendor-item');
        items.forEach(item => {
            if (item.getAttribute('data-category').toLowerCase() === cat.toLowerCase()) {
                item.classList.remove('hidden');
            } else {
                item.classList.add('hidden');
            }
        });
        window.scrollTo({ top: document.getElementById('vendor-section').offsetTop - 100, behavior: 'smooth' });
    }

    function toggleDetails(id) {
        const panel = document.getElementById('details-' + id);
        if (panel) {
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }
    }

    function handleBooking(btn) {
        const id = btn.getAttribute('data-id');
        if (!bucket.find(i => i.id === id)) {
            bucket.push({ id, name: btn.getAttribute('data-name'), price: parseFloat(btn.getAttribute('data-price')) });
            sessionStorage.setItem('vivaha_bucket', JSON.stringify(bucket));
            document.getElementById('bucket-count').innerText = bucket.length;
            alert("Added to bucket!");
        }
    }

    function handleInquiry(vendorId) {
        window.location.href = '/inquiry?vendorId=' + vendorId;
    }

    function openBucket() {
        let msg = bucket.length === 0 ? 'Your bucket is empty.' : bucket.map(i => i.name + ' - ' + i.price + ' LKR').join('\n');
        alert('My Bucket:\n' + msg);
    }
</script>
</body>
</html>
