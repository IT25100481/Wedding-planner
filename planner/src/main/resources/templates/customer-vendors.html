<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Explore Vendors | Kik Plus</title>
    <link rel="stylesheet" th:href="@{/static/style.css}">
    <style>
        .filter-bar { padding: 20px 5%; background: var(--cream); display: flex; gap: 20px; align-items: center; }
        .vendor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; padding: 40px 5%; }
        .vendor-card { border: 1px solid #ddd; border-radius: 15px; overflow: hidden; background: #fff; }
        .vendor-info { padding: 20px; }
        .tag { background: var(--sage-green); color: white; padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; }
    </style>
</head>
<body>
<div class="filter-bar">
    <span>Filter by Tradition:</span>
    <select id="traditionFilter">
        <option value="All">All Traditions</option>
        <option value="Sinhalese">Sinhalese</option>
        <option value="Hindu">Hindu</option>
        <option value="Muslim">Muslim</option>
    </select>
</div>

<div class="vendor-grid">
    <!-- This loop pulls data from the same services.txt file -->
    <div th:each="service : ${services}" class="vendor-card">
        <div class="vendor-info">
            <span class="tag" th:text="${service.tradition}"></span>
            <h3 th:text="${service.businessName}" style="font-family: 'Cormorant Garamond'; margin: 10px 0;"></h3>
            <p th:text="${service.category}" style="color: #666; font-size: 0.9rem;"></p>
            <p th:text="${service.description}"></p>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
                <span th:text="${service.price + ' LKR'}" style="font-weight: bold;"></span>
                <button class="btn-primary" style="padding: 8px 15px; font-size: 0.8rem;">ADD TO CART</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
