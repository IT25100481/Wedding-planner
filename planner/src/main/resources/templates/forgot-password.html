<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recover Access | Vivaha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="split-layout-body">
<div class="split-container">
    <div class="split-form" style="flex: 1;">
        <div class="form-wrapper">
            <header class="mb-5 text-center">
                <h3 class="editorial-title">Recover <em>Access</em></h3>

                <p th:if="${param.mismatch}" style="color: #ff6b6b; font-weight: 600; font-size: 0.8rem; margin-top: 10px; letter-spacing: 1px;">
                    CREDENTIALS DO NOT MATCH OUR RECORDS.
                </p>

                <p th:if="${param.mismatch == null}" style="font-size: 0.8rem; color: rgba(255,255,255,0.5);">
                    Please verify your unique username and registered email.
                </p>
            </header>

            <form th:action="@{/forgot-password}" method="post" class="luxury-form">

                <div class="input-group-custom">
                    <label>USERNAME</label>
                    <input type="text" name="username" placeholder="Enter your username" required>
                </div>

                <div class="input-group-custom mt-3">
                    <label>REGISTERED EMAIL</label>
                    <input type="email" name="email" placeholder="your@email.com" required>
                </div>

                <button type="submit" class="btn-editorial-gold mt-4">VERIFY & SEND LINK</button>
            </form>

            <footer class="text-center mt-5">
                <a href="/login" class="link-gold" style="font-size: 0.75rem;">← BACK TO SIGN IN</a>
            </footer>
        </div>
    </div>
</div>
</body>
</html>
