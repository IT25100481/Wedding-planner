<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recover Access | Vivaha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="split-layout-body">
<div class="split-container">
    <div class="split-form" style="flex: 1;">
        <div class="form-wrapper">
            <header class="mb-5">
                <h3 class="editorial-title">Recover <em>Access</em></h3>
                <p style="font-size: 0.8rem; color: rgba(255,255,255,0.5);">We will send a secure link to your registered Gmail.</p>
            </header>

            <form th:action="@{/forgot-password}" method="post" class="luxury-form">
                <div class="input-group-custom">
                    <label>EMAIL ADDRESS</label>
                    <input type="email" name="email" placeholder="your@email.com" required>
                </div>
                <button type="submit" class="btn-editorial-gold mt-3">SEND RESET LINK</button>
            </form>

            <p class="text-center mt-4">
                <a href="/login" class="link-gold" style="font-size: 0.7rem;">BACK TO LOGIN</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
