<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" th:href="@{'/images/logo color.png'}">

    <title>VIVAHA | Premium Weddings</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid px-5">
        <a class="navbar-brand-vivaha" href="/" style="text-decoration: none !important;">
            <img th:src="@{'/images/logo color.png'}" alt="Vivaha Logo" class="nav-logo">
            <span class="brand-text">Vivaha</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
            <div class="navbar-nav gap-4">
                <a class="nav-link" href="/">HOME</a>
                <a class="nav-link" href="/vendors">VENDORS</a>
                <a class="nav-link" href="/hotels">HOTELS</a>
                <a class="nav-link" href="/gallery">GALLERY</a>
                <a class="nav-link" href="/about">ABOUT</a>
            </div>
        </div>

        <div class="d-flex gap-3 align-items-center">
            <a href="/login" class="btn-login-luxury">LOGIN</a>
            <a href="/register" class="btn-register-luxury">REGISTER</a>
        </div>
    </div>
</nav>

<section class="hero-full">
    <div class="hero-overlay"></div>
    <div class="container hero-content-container">
        <div class="row">
            <div class="col-lg-7">
                <div class="est-line">
                    <span class="line"></span> EST. 2026 &nbsp;•&nbsp; PREMIER WEDDING SERVICES <span class="line"></span>
                </div>

                <h1 class="main-heading">
                    Your Dream<br>
                    <span class="gold-italic">Wedding</span><br>
                    Begins Here
                </h1>

                <p class="hero-subtitle">
                    From intimate ceremonies to grand celebrations — curated vendors,
                    exquisite venues, and unforgettable memories crafted with love and elegance.
                </p>

                <div class="hero-btn-group">
                    <a href="/register" class="btn-main-gold">BEGIN PLANNING</a>
                    <a href="/gallery" class="btn-main-outline">VIEW GALLERY</a>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
