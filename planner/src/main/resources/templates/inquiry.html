<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Make an Inquiry | Vivaha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="background-color: #1a1209; color: white;">

<div th:replace="~{index :: nav}"></div>

<div class="container" style="margin-top: 150px; max-width: 600px;">
    <h2 class="text-center" style="color: #d4a373; font-family: 'Cormorant Garamond';">Inquiry Form</h2>
    <p class="text-center text-white-50">Please fill the details below.</p>

    <form th:action="@{/submit-inquiry}" method="POST" class="mt-4">

        <div class="mb-3">
            <label class="form-label">Your Email (Logged In)</label>
            <input type="email" name="customerEmail"
                   class="form-control bg-dark text-white border-secondary"
                   th:value="${session.loggedInUser}"
                   readonly style="opacity: 0.7; cursor: not-allowed;">
            <small class="text-white-50">Email is linked to your registered account.</small>
        </div>

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="customerName" class="form-control bg-dark text-white border-secondary" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Contact Number</label>
            <input type="text" name="contactNo" class="form-control bg-dark text-white border-secondary" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Wedding Date</label>
            <input type="date" name="weddingDate" class="form-control bg-dark text-white border-secondary" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea name="message" class="form-control bg-dark text-white border-secondary" rows="4" placeholder="How can we help you?"></textarea>
        </div>

        <button type="submit" class="btn w-100 mt-2" style="background-color: #d4a373; color: black; font-weight: bold;">
            SEND INQUIRY
        </button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
