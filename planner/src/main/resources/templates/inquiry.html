<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIVAHA | Inquiry Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #140e08; color: #ffffff; font-family: 'Segoe UI', sans-serif; }
        .form-container { max-width: 650px; margin: 50px auto; background-color: #1a130b; padding: 40px; border-radius: 8px; border: 1px solid #2a2015; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .form-title { color: #c9a84c; font-family: 'Georgia', serif; text-align: center; margin-bottom: 5px; }
        .form-subtitle { text-align: center; color: #a0958a; font-size: 14px; margin-bottom: 30px; }
        .form-control { background-color: #241c13 !important; border: 1px solid #3a2f21 !important; color: #ffffff !important; border-radius: 4px; padding: 12px; }
        .form-control:focus { border-color: #c9a84c !important; box-shadow: 0 0 5px rgba(201, 168, 76, 0.5) !important; }
        .form-label { color: #ffffff; font-weight: 500; margin-top: 15px; }
        .btn-submit { background-color: #c9a84c; color: #140e08; font-weight: bold; border: none; padding: 12px; width: 100%; border-radius: 4px; margin-top: 25px; transition: all 0.3s ease; }
        .btn-submit:hover { background-color: #e5b27d; cursor: pointer; }
        .text-muted-custom { color: #8a7e72; font-size: 12px; display: block; margin-top: 5px; }

        /* Custom Alert Banner Styling matched with VIVAHA design system */
        .alert-success-custom {
            background-color: #241c13;
            border: 1px solid #c9a84c;
            color: #c9a84c;
            padding: 14px 20px;
            font-size: 14px;
            margin-bottom: 25px;
            text-align: center;
            border-radius: 4px;
            font-family: 'Segoe UI', sans-serif;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-container">
        <h2 class="form-title">Inquiry Form</h2>
        <p class="form-subtitle">Please fill out the details below.</p>

        <div th:if="${successMessage}" class="alert-success-custom">
            ✦ <span th:text="${successMessage}"></span>
        </div>

        <form th:action="@{/submit-inquiry}" th:object="${inquiry}" method="post">

            <label class="form-label">Your Email Address</label>
            <input type="email" id="customUserTypedEmail" name="customUserTypedEmail" class="form-control" placeholder="Enter your registered email" autocomplete="new-password" required />
            <span class="text-muted-custom">Please enter the email linked to your registered profile.</span>

            <label class="form-label">Full Name</label>
            <input type="text" th:field="*{customerName}" class="form-control" placeholder="Enter your full name" required />

            <label class="form-label">Contact Number</label>
            <input type="text" th:field="*{contactNo}" class="form-control" placeholder="Enter your mobile number" required />

            <label class="form-label">Select Profile Type (Who are you?)</label>
            <select th:field="*{userRole}" class="form-control" required>
                <option value="Guest">-- Select Profile Type --</option>
                <option value="Couple">I am a Couple (Looking for Services)</option>
                <option value="Vendor">I am a Vendor (Offering Services)</option>
            </select>

            <label class="form-label">Message</label>
            <textarea th:field="*{message}" class="form-control" rows="5" placeholder="Write your requirements here..." required></textarea>

            <button type="submit" class="btn btn-submit">Submit Inquiry</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
