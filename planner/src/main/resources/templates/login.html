<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{'/images/logo color.png'}">
    <title>Login | Vivaha Boutique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="split-layout-body">

<div class="split-container">
    <div class="split-visual d-none d-lg-flex">
        <div class="visual-overlay"></div>
        <div class="visual-content text-center">
            <img th:src="@{'/images/logo color.png'}" alt="Vivaha Logo" style="height: 100px;">
            <h2 class="brand-text" style="font-size: 4rem;">Vivaha</h2>
            <p style="letter-spacing: 5px; font-size: 0.7rem; color: white;">WELCOME BACK</p>
        </div>
    </div>

    <div class="split-form">
        <div class="form-wrapper">
            <header class="mb-5">
                <h3 class="editorial-title">Sign <em>In</em></h3>
                <p style="font-size: 0.8rem; color: rgba(255,255,255,0.5);">Access your curated wedding dashboard.</p>
            </header>

            <div th:if="${param.error}" class="alert alert-danger" style="background: transparent; border: 1px solid #ff4d4d; color: #ff4d4d; border-radius: 0; font-size: 0.8rem;">
                The email or password you entered is incorrect.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="input-group-custom">
                    <label>EMAIL ADDRESS</label>
                    <input type="email" name="email" placeholder="your@email.com" required>
                </div>

                <div class="input-group-custom">
                    <label>PASSWORD</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-editorial-gold">SIGN IN</button>
            </form>

            <p class="text-center mt-4" style="font-size: 0.75rem; opacity: 0.5;">
                NEW HERE? <a href="/register" class="link-gold">JOIN THE EXHIBITION</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
