<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="@{'/images/logo color.png'}">
    <title>Login | Vivaha Boutique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="split-layout-body">

<div class="split-container">
    <div class="split-visual d-none d-lg-flex">
        <div class="visual-overlay"></div>
        <div class="visual-content">
            <img th:src="@{'/images/logo color.png'}" alt="Vivaha Logo" class="reg-logo-small">
            <h2 class="brand-text">Vivaha</h2>
            <p class="brand-tagline">WELCOME BACK</p>
        </div>
    </div>

    <div class="split-form">
        <div class="form-wrapper">
            <header class="mb-5">
                <h3 class="editorial-title">Sign <em>In</em></h3>

                <p th:if="${param.sent}" class="success-alert-text">
                    RESET LINK SENT! PLEASE CHECK YOUR GMAIL.
                </p>

                <p th:if="${param.resetSuccess}" class="success-alert-text">
                    PASSWORD UPDATED! YOU CAN NOW SIGN IN.
                </p>

                <p th:if="${param.notFound}" style="color: #ff6b6b; font-weight: 600; font-size: 0.8rem; margin-top: 10px; letter-spacing: 1px;">
                    ACCOUNT NOT FOUND. PLEASE REGISTER.
                </p>

                <p th:if="${param.error}" style="color: #ff6b6b; font-weight: 600; font-size: 0.8rem; margin-top: 10px; letter-spacing: 1px;">
                    INVALID CREDENTIALS. PLEASE TRY AGAIN.
                </p>

                <p th:if="${param.error == null and param.sent == null and param.resetSuccess == null and param.notFound == null}"
                   style="font-size: 0.8rem; color: rgba(255,255,255,0.5);">
                    Access your curated wedding dashboard.
                </p>
            </header>

            <form th:action="@{/login}" method="post" class="luxury-form">
                <div class="input-group-custom">
                    <label>USERNAME</label>
                    <input type="text" name="username" placeholder="Enter your username" required>
                </div>

                <div class="input-group-custom mb-2">
                    <label>PASSWORD</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="text-end mb-4">
                    <a href="/forgot-password" class="link-gold" style="font-size: 0.7rem; letter-spacing: 1px; opacity: 0.8;">
                        FORGOT PASSWORD?
                    </a>
                </div>

                <button type="submit" class="btn-editorial-gold">SIGN IN</button>
            </form>

            <footer class="text-center mt-5">
                <p style="font-size: 0.8rem; color: rgba(255,255,255,0.4);">
                    NEW HERE?
                    <a href="/register" class="link-gold">JOIN THE EXHIBITION</a>
                </p>
            </footer>
        </div>
    </div>
</div>
</body>
</html>
