<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Packages | Wedding Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c9a84c; --gold-dark: #9a7a2e; --cream: #fdf8f2; --dark: #1a1209; --text-muted: #7a6a50; }
        body { background: var(--cream); font-family: 'Montserrat', sans-serif; font-weight: 300; }
        .navbar { background: rgba(26,18,9,0.97) !important; padding: 16px 40px; }
        .navbar-brand { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; color: var(--gold) !important; letter-spacing: 3px; }
        .nav-link { color: rgba(255,255,255,0.75) !important; font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; }
        .nav-link:hover { color: var(--gold) !important; }
        .page-header { background: var(--dark); padding: 50px 80px; }
        .page-tag { font-size: 0.65rem; letter-spacing: 5px; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
        .page-title { font-family: 'Cormorant Garamond', serif; font-size: 2.8rem; font-weight: 300; color: #fff; }
        .page-title em { font-style: italic; color: #e8d5a3; }
        .main { padding: 50px 80px; }
        .panel { background: #fff; border: 1px solid rgba(201,168,76,0.2); padding: 32px; margin-bottom: 24px; }
        .panel-title { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 400; color: var(--dark); margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid rgba(201,168,76,0.15); }
        .form-label { font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); }
        .form-control, .form-select { border-radius: 0; border: 1px solid rgba(201,168,76,0.3); font-size: 0.85rem; }
        .form-control:focus, .form-select:focus { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(201,168,76,0.15); }
        .btn-gold { background: var(--gold); color: var(--dark); font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; padding: 10px 24px; border-radius: 0; border: none; font-weight: 500; }
        .btn-gold:hover { background: var(--gold-dark); color: #fff; }
        .filter-btn { font-size: 0.68rem; letter-spacing: 2px; text-transform: uppercase; padding: 7px 20px; border-radius: 0; border: 1px solid rgba(201,168,76,0.4); background: transparent; color: var(--text-muted); }
        .filter-btn.active, .filter-btn:hover { background: var(--gold); color: var(--dark); border-color: var(--gold); }
        .package-card { background: #fff; border: 1px solid rgba(201,168,76,0.2); padding: 28px; height: 100%; transition: all 0.3s; position: relative; }
        .package-card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(26,18,9,0.1); }
        .badge-BASIC { background: rgba(201,168,76,0.15); color: var(--gold-dark); font-size: 0.6rem; letter-spacing: 2px; padding: 3px 12px; }
        .badge-PREMIUM { background: var(--gold); color: var(--dark); font-size: 0.6rem; letter-spacing: 2px; padding: 3px 12px; }
        .badge-CUSTOM { background: var(--dark); color: var(--gold); font-size: 0.6rem; letter-spacing: 2px; padding: 3px 12px; }
        .pkg-name { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 400; color: var(--dark); margin: 10px 0 5px; }
        .pkg-price { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: var(--gold); font-weight: 300; }
        .pkg-price span { font-size: 0.9rem; }
        .pkg-desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.7; margin: 10px 0; }
        .pkg-actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(201,168,76,0.1); }
        .btn-edit { flex: 1; font-size: 0.65rem; letter-spacing: 1px; text-transform: uppercase; padding: 7px; border: 1px solid rgba(201,168,76,0.4); background: transparent; color: var(--gold); text-decoration: none; text-align: center; }
        .btn-delete { flex: 1; font-size: 0.65rem; letter-spacing: 1px; text-transform: uppercase; padding: 7px; border: 1px solid rgba(220,53,69,0.3); background: transparent; color: #c0392b; text-decoration: none; text-align: center; }
        .alert-success-custom { background: #f0fdf4; border: 1px solid #86efac; color: #166534; padding: 12px 16px; font-size: 0.82rem; margin-bottom: 20px; }
        .empty-state { text-align: center; padding: 60px; color: var(--text-muted); }
        @media (max-width: 768px) { .page-header, .main { padding: 30px 20px; } .navbar { padding: 14px 20px; } }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
    <a class="navbar-brand" href="/">✦ Wedding Planner</a>
    <div class="d-flex gap-4 ms-4">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link" href="/packages">Packages</a>
        <a class="nav-link" href="/payments">Payments</a>
    </div>
</nav>

<!-- PAGE HEADER -->
<div class="page-header">
    <div class="page-tag">Vendor Dashboard</div>
    <div class="page-title">Service <em>Packages</em></div>
</div>

<div class="main">

    <!-- SUCCESS MESSAGE -->
    <div th:if="${param.success}" class="alert-success-custom">
        ✅ Package
        <span th:if="${param.success[0] == 'added'}">added</span>
        <span th:if="${param.success[0] == 'updated'}">updated</span>
        <span th:if="${param.success[0] == 'deleted'}">deleted</span>
        successfully!
    </div>

    <div class="row g-4">

        <!-- LEFT: ADD FORM -->
        <div class="col-lg-4">
            <div class="panel">
                <div class="panel-title">➕ Add New Package</div>
                <form th:action="@{/packages/add}" th:object="${newPackage}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Package Name</label>
                        <input type="text" class="form-control" th:field="*{packageName}" placeholder="e.g. Gold Wedding Package" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Package Type</label>
                        <select class="form-select" th:field="*{packageType}" required>
                            <option value="BASIC">Basic</option>
                            <option value="PREMIUM">Premium</option>
                            <option value="CUSTOM">Custom</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Price (LKR)</label>
                        <input type="number" class="form-control" th:field="*{price}" placeholder="e.g. 150000" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Describe the package..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Inclusions</label>
                        <textarea class="form-control" th:field="*{inclusions}" rows="3" placeholder="Photography; Decoration; Cake"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Exclusions</label>
                        <textarea class="form-control" th:field="*{exclusions}" rows="2" placeholder="Catering; Transport"></textarea>
                    </div>
                    <button type="submit" class="btn-gold w-100">Add Package</button>
                </form>
            </div>
        </div>

        <!-- RIGHT: PACKAGES LIST -->
        <div class="col-lg-8">

            <!-- FILTER BUTTONS -->
            <div class="d-flex gap-2 mb-4 flex-wrap">
                <a th:href="@{/packages(type='ALL')}" th:class="${selectedType == 'ALL'} ? 'filter-btn active' : 'filter-btn'">All</a>
                <a th:href="@{/packages(type='BASIC')}" th:class="${selectedType == 'BASIC'} ? 'filter-btn active' : 'filter-btn'">Basic</a>
                <a th:href="@{/packages(type='PREMIUM')}" th:class="${selectedType == 'PREMIUM'} ? 'filter-btn active' : 'filter-btn'">Premium</a>
                <a th:href="@{/packages(type='CUSTOM')}" th:class="${selectedType == 'CUSTOM'} ? 'filter-btn active' : 'filter-btn'">Custom</a>
            </div>

            <!-- PACKAGES GRID -->
            <div class="row g-3" th:if="${not #lists.isEmpty(packages)}">
                <div class="col-md-6" th:each="pkg : ${packages}">
                    <div class="package-card">
                        <span th:class="'badge-' + ${pkg.packageType}" th:text="${pkg.packageType}"></span>
                        <div class="pkg-name" th:text="${pkg.packageName}"></div>
                        <div class="pkg-price"><span>LKR </span><span th:text="${#numbers.formatDecimal(pkg.price, 0, 'COMMA', 0, 'POINT')}"></span></div>
                        <div class="pkg-desc" th:text="${pkg.description}"></div>
                        <div th:if="${pkg.inclusions != null and !pkg.inclusions.isEmpty()}" style="font-size:0.75rem;color:var(--gold);margin-top:8px;">
                            ✦ <span th:text="${pkg.inclusions}"></span>
                        </div>
                        <div class="pkg-actions">
                            <a th:href="@{/packages/edit/{id}(id=${pkg.id})}" class="btn-edit">Edit</a>
                            <a th:href="@{/packages/delete/{id}(id=${pkg.id})}" class="btn-delete"
                               onclick="return confirm('Delete this package?')">Delete</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- EMPTY STATE -->
            <div class="empty-state" th:if="${#lists.isEmpty(packages)}">
                <div style="font-size:2rem;">💍</div>
                <div style="font-family:'Cormorant Garamond',serif;font-size:1.6rem;margin:12px 0;">No Packages Yet</div>
                <div>Add your first package using the form on the left!</div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
