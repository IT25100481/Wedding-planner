<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Packages | Vivaha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --gold:#c9a84c; --gold-light:#e8d5a3; --gold-dark:#9a7a2e; --cream:#fdf8f2; --dark:#1a1209; --text-muted:#7a6a50; --border:rgba(201,168,76,0.2); }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--cream); font-family:'Montserrat',sans-serif; font-weight:300; color:var(--dark); }

        /* NAVBAR */
        .navbar { background:var(--dark); padding:16px 40px; position:sticky; top:0; z-index:100; }
        .navbar-brand { font-family:'Cormorant Garamond',serif; font-size:1.5rem; color:var(--gold) !important; letter-spacing:3px; text-decoration:none; }
        .nav-link { color:rgba(255,255,255,0.65) !important; font-size:0.7rem; letter-spacing:2px; text-transform:uppercase; transition:color 0.2s; text-decoration:none; }
        .nav-link:hover, .nav-link.active { color:var(--gold) !important; }

        /* PAGE HEADER */
        .page-header { background:var(--dark); padding:56px 80px 48px; }
        .page-tag { font-size:0.6rem; letter-spacing:5px; text-transform:uppercase; color:var(--gold); margin-bottom:10px; }
        .page-title { font-family:'Cormorant Garamond',serif; font-size:3rem; font-weight:300; color:#fff; }
        .page-title em { font-style:italic; color:var(--gold-light); }
        .page-sub { font-size:0.78rem; color:rgba(255,255,255,0.4); margin-top:10px; letter-spacing:0.5px; }

        /* MAIN */
        .main { padding:40px 80px; }

        /* FILTER */
        .filter-bar { display:flex; gap:8px; margin-bottom:32px; flex-wrap:wrap; }
        .f-btn { font-size:0.62rem; letter-spacing:2px; text-transform:uppercase; padding:8px 22px; border:1px solid var(--border); background:transparent; color:var(--text-muted); cursor:pointer; transition:all 0.2s; border-radius:0; text-decoration:none; }
        .f-btn:hover, .f-btn.active { background:var(--gold); color:var(--dark); border-color:var(--gold); }

        /* PACKAGE CARD */
        .package-card { background:#fff; border:1px solid var(--border); padding:32px; height:100%; display:flex; flex-direction:column; transition:all 0.3s; position:relative; }
        .package-card:hover { transform:translateY(-6px); box-shadow:0 20px 48px rgba(26,18,9,0.1); border-color:rgba(201,168,76,0.5); }

        /* TYPE BADGE */
        .type-badge { font-size:0.58rem; letter-spacing:2.5px; text-transform:uppercase; padding:3px 12px; display:inline-block; margin-bottom:14px; }
        .badge-BASIC   { background:rgba(201,168,76,0.12); color:var(--gold-dark); }
        .badge-PREMIUM { background:var(--gold); color:var(--dark); }
        .badge-CUSTOM  { background:var(--dark); color:var(--gold); }

        .pkg-name { font-family:'Cormorant Garamond',serif; font-size:1.5rem; font-weight:400; color:var(--dark); margin-bottom:8px; }
        .pkg-price { font-family:'Cormorant Garamond',serif; font-size:2.2rem; color:var(--gold); font-weight:300; margin-bottom:14px; line-height:1; }
        .pkg-price small { font-size:0.9rem; }
        .pkg-desc { font-size:0.78rem; color:var(--text-muted); line-height:1.75; margin-bottom:18px; flex:1; }

        /* INCLUSIONS / EXCLUSIONS */
        .tags-label { font-size:0.58rem; letter-spacing:2px; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px; }
        .tags-wrap { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px; }
        .tag-in  { font-size:0.6rem; background:rgba(201,168,76,0.1); color:var(--gold-dark); padding:3px 9px; }
        .tag-out { font-size:0.6rem; background:rgba(220,53,69,0.07); color:#c0392b; padding:3px 9px; }

        /* BOOK NOW BUTTON */
        .btn-book { display:block; width:100%; background:var(--gold); color:var(--dark); border:none; padding:14px; font-size:0.7rem; letter-spacing:3px; text-transform:uppercase; font-weight:500; text-align:center; text-decoration:none; transition:all 0.3s; margin-top:18px; }
        .btn-book:hover { background:var(--gold-dark); color:#fff; }

        /* EMPTY */
        .empty { text-align:center; padding:80px 20px; color:var(--text-muted); }
        .empty-icon { font-size:3rem; margin-bottom:14px; opacity:.3; }

        @media (max-width:768px) { .navbar,.page-header,.main { padding-left:20px; padding-right:20px; } }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar d-flex align-items-center">
    <a class="navbar-brand" href="/">✦ Vivaha</a>
    <div class="d-flex gap-4 ms-5">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link active" href="/packages">Packages</a>
        <a class="nav-link" href="/customer-vendors">Vendors</a>
    </div>
</nav>

<!-- PAGE HEADER -->
<div class="page-header">
    <div class="page-tag">Our Offerings</div>
    <div class="page-title">Service <em>Packages</em></div>
    <div class="page-sub">Choose the perfect package for your special day</div>
</div>

<!-- MAIN -->
<div class="main">

    <!-- FILTER -->
    <div class="filter-bar">
        <a th:href="@{/packages(type='ALL')}"
           th:classappend="${selectedType == 'ALL'} ? ' active' : ''"
           class="f-btn">All</a>
        <a th:href="@{/packages(type='BASIC')}"
           th:classappend="${selectedType == 'BASIC'} ? ' active' : ''"
           class="f-btn">Basic</a>
        <a th:href="@{/packages(type='PREMIUM')}"
           th:classappend="${selectedType == 'PREMIUM'} ? ' active' : ''"
           class="f-btn">Premium</a>
        <a th:href="@{/packages(type='CUSTOM')}"
           th:classappend="${selectedType == 'CUSTOM'} ? ' active' : ''"
           class="f-btn">Custom</a>
    </div>

    <!-- EMPTY STATE -->
    <div class="empty" th:if="${#lists.isEmpty(packages)}">
        <div class="empty-icon">📦</div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:1.8rem;margin-bottom:8px">No Packages Available</div>
        <div style="font-size:.78rem">Check back soon for our service offerings.</div>
    </div>

    <!-- CARDS -->
    <div class="row g-4" th:if="${!#lists.isEmpty(packages)}">
        <div class="col-lg-4 col-md-6" th:each="pkg : ${packages}" th:if="${pkg.active}">
            <div class="package-card">

                <!-- Type badge -->
                <span class="type-badge"
                      th:classappend="'badge-' + ${pkg.packageType}"
                      th:text="${pkg.packageType}">—</span>

                <!-- Name & Price -->
                <div class="pkg-name" th:text="${pkg.packageName}">—</div>
                <div class="pkg-price">
                    <small>LKR </small>
                    <span th:text="${#numbers.formatDecimal(pkg.price, 1, 0)}">—</span>
                </div>

                <!-- Description -->
                <div class="pkg-desc" th:text="${pkg.description}">—</div>

                <!-- Inclusions -->
                <div th:if="${pkg.inclusions != null and !pkg.inclusions.isEmpty()}">
                    <div class="tags-label">Includes</div>
                    <div class="tags-wrap">
                        <span class="tag-in"
                              th:each="item : ${#strings.arraySplit(pkg.inclusions, ',')}"
                              th:text="${#strings.trim(item)}">—</span>
                    </div>
                </div>

                <!-- Exclusions -->
                <div th:if="${pkg.exclusions != null and !pkg.exclusions.isEmpty()}">
                    <div class="tags-label">Excludes</div>
                    <div class="tags-wrap">
                        <span class="tag-out"
                              th:each="item : ${#strings.arraySplit(pkg.exclusions, ',')}"
                              th:text="${#strings.trim(item)}">—</span>
                    </div>
                </div>

                <!-- BOOK NOW → goes to payment page with package details -->
                <a th:href="@{/payments(bookingId=${'PKG-' + pkg.id},
                                        vendorName=${pkg.packageName},
                                        totalAmount=${pkg.price})}"
                   class="btn-book">Book Now</a>

            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
