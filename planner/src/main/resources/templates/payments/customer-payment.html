<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment | Vivaha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a84c;
            --gold-light: #e8d5a3;
            --gold-dark: #9a7a2e;
            --cream: #fdf8f2;
            --dark: #1a1209;
            --text-muted: #7a6a50;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--dark);
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .payment-wrapper {
            width: 100%;
            max-width: 520px;
        }

        .brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            color: var(--gold);
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 32px;
            text-decoration: none;
            display: block;
        }

        .payment-card {
            background: var(--cream);
            padding: 48px;
        }

        .payment-tag {
            font-size: 0.62rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .payment-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 300;
            color: var(--dark);
            margin-bottom: 32px;
        }

        /* BOOKING SUMMARY */
        .booking-summary {
            background: rgba(201,168,76,0.08);
            border: 1px solid rgba(201,168,76,0.2);
            padding: 20px;
            margin-bottom: 28px;
        }
        .summary-title {
            font-size: 0.62rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 12px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .summary-row.total {
            border-top: 1px solid rgba(201,168,76,0.2);
            padding-top: 10px;
            margin-top: 4px;
            font-weight: 500;
            color: var(--dark);
        }
        .summary-row .amount {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            color: var(--gold);
        }

        /* FORM */
        .form-label {
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
        }
        .form-control, .form-select {
            border-radius: 0;
            border: 1px solid rgba(201,168,76,0.3);
            font-size: 0.85rem;
            padding: 12px 14px;
            font-family: 'Montserrat', sans-serif;
            width: 100%;
            margin-bottom: 20px;
            background: #fff;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 2px rgba(201,168,76,0.15);
            outline: none;
        }

        /* PAYMENT METHOD CARDS */
        .method-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .method-card {
            border: 1px solid rgba(201,168,76,0.3);
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fff;
        }
        .method-card:hover { border-color: var(--gold); }
        .method-card.selected { border-color: var(--gold); background: rgba(201,168,76,0.08); }
        .method-card input { display: none; }
        .method-icon { font-size: 1.4rem; margin-bottom: 6px; display: block; }
        .method-name { font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); }

        /* VALIDATION */
        .error-msg { color: #c0392b; font-size: 0.72rem; margin-top: -14px; margin-bottom: 14px; display: none; }
        .form-control.is-invalid { border-color: #c0392b; }
        .form-control.is-valid { border-color: #27ae60; }

        /* BUTTON */
        .btn-pay {
            width: 100%;
            background: var(--gold);
            color: var(--dark);
            border: none;
            padding: 16px;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }
        .btn-pay:hover { background: var(--gold-dark); color: #fff; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
        }
        .back-link:hover { color: var(--gold); }

        /* SUCCESS */
        .success-box {
            background: #f0fdf4;
            border: 1px solid #86efac;
            color: #166534;
            padding: 16px;
            font-size: 0.82rem;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="payment-wrapper">
    <a href="/" class="brand">✦ Vivaha</a>

    <div class="payment-card">
        <div class="payment-tag">Secure Checkout</div>
        <div class="payment-title">Complete Your Payment</div>

        <!-- SUCCESS MESSAGE -->
        <div th:if="${param.success}" class="success-box">
            ✅ Payment recorded successfully! Thank you for your booking.
        </div>

        <!-- BOOKING SUMMARY -->
        <div class="booking-summary">
            <div class="summary-title">Booking Summary</div>
            <div class="summary-row">
                <span>Booking ID</span>
                <span th:text="${newPayment.bookingId != null ? newPayment.bookingId : 'N/A'}">N/A</span>
            </div>
            <div class="summary-row">
                <span>Vendor</span>
                <span th:text="${newPayment.vendorName != null ? newPayment.vendorName : 'N/A'}">N/A</span>
            </div>
            <div class="summary-row total">
                <span>Total Amount</span>
                <span class="amount">LKR <span th:text="${newPayment.totalAmount != null ? newPayment.totalAmount : '0.00'}">0.00</span></span>
            </div>
        </div>

        <!-- PAYMENT FORM -->
        <form th:action="@{/payments/add}" th:object="${newPayment}" method="post" onsubmit="return validatePayment()">
            <input type="hidden" th:field="*{bookingId}">
            <input type="hidden" th:field="*{vendorName}">
            <input type="hidden" th:field="*{totalAmount}">
            <input type="hidden" name="paymentMethod" id="selectedMethod" value="CASH">

            <!-- AMOUNT TO PAY -->
            <label class="form-label">Amount to Pay (LKR)</label>
            <input type="number" class="form-control" id="amountPaid"
                   th:field="*{amountPaid}" placeholder="Enter amount" step="0.01" required>
            <div class="error-msg" id="amountError">⚠ Amount cannot exceed total amount!</div>

            <!-- PAYMENT METHOD -->
            <label class="form-label">Payment Method</label>
            <div class="method-grid">
                <label class="method-card selected" onclick="selectMethod('CASH', this)">
                    <span class="method-icon">💵</span>
                    <span class="method-name">Cash</span>
                </label>
                <label class="method-card" onclick="selectMethod('CARD', this)">
                    <span class="method-icon">💳</span>
                    <span class="method-name">Card</span>
                </label>
                <label class="method-card" onclick="selectMethod('BANK_TRANSFER', this)">
                    <span class="method-icon">🏦</span>
                    <span class="method-name">Bank Transfer</span>
                </label>
                <label class="method-card" onclick="selectMethod('PAYHERE', this)">
                    <span class="method-icon">📱</span>
                    <span class="method-name">PayHere</span>
                </label>
            </div>

            <!-- TRANSACTION ID -->
            <label class="form-label">Transaction ID <span style="color:var(--text-muted)">(optional)</span></label>
            <input type="text" class="form-control" th:field="*{transactionId}" placeholder="Auto-generated if empty">

            <!-- NOTES -->
            <label class="form-label">Notes <span style="color:var(--text-muted)">(optional)</span></label>
            <input type="text" class="form-control" th:field="*{notes}" placeholder="Any special instructions...">

            <button type="submit" class="btn-pay">Confirm Payment</button>
        </form>
    </div>

    <a href="/" class="back-link">← Back to Home</a>
</div>

<script>
    function selectMethod(method, el) {
        document.querySelectorAll('.method-card').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
        document.getElementById('selectedMethod').value = method;
    }

    function validatePayment() {
        const amountPaid = parseFloat(document.getElementById('amountPaid').value);
        const totalAmount = parseFloat('[[${newPayment.totalAmount != null ? newPayment.totalAmount : 999999999}]]');
        const amountError = document.getElementById('amountError');
        const amountField = document.getElementById('amountPaid');

        if (!amountPaid || amountPaid <= 0 || amountPaid > totalAmount) {
            amountError.style.display = 'block';
            amountField.classList.add('is-invalid');
            return false;
        }
        amountError.style.display = 'none';
        amountField.classList.remove('is-invalid');
        return true;
    }
</script>
</body>
</html>
