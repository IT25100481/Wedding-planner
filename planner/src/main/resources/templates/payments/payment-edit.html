<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Payment | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c9a84c; --gold-dark: #9a7a2e; --cream: #fdf8f2; --dark: #1a1209; --text-muted: #7a6a50; }
        body { background: var(--cream); font-family: 'Montserrat', sans-serif; font-weight: 300; }
        .navbar { background: var(--dark); padding: 16px 40px; }
        .navbar-brand { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; color: var(--gold) !important; letter-spacing: 3px; text-decoration: none; }
        .nav-link { color: rgba(255,255,255,0.75) !important; font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; }
        .nav-link:hover { color: var(--gold) !important; }
        .btn-logout { background: transparent; border: 1px solid rgba(201,168,76,0.5); color: var(--gold); font-size: 0.68rem; letter-spacing: 2px; text-transform: uppercase; padding: 6px 16px; text-decoration: none; }
        .main { padding: 50px 80px; max-width: 760px; margin: 0 auto; }
        .panel { background: #fff; border: 1px solid rgba(201,168,76,0.2); padding: 36px; }
        .panel-title { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 300; color: var(--dark); margin-bottom: 24px; padding-bottom: 14px; border-bottom: 1px solid rgba(201,168,76,0.15); }
        .form-label { font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); }
        .form-control, .form-select { border-radius: 0; border: 1px solid rgba(201,168,76,0.3); font-size: 0.85rem; }
        .form-control:focus, .form-select:focus { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(201,168,76,0.15); outline: none; }
        .btn-gold { background: var(--gold); color: var(--dark); font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; padding: 12px 28px; border-radius: 0; border: none; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .btn-gold:hover { background: var(--gold-dark); color: #fff; }
        .btn-back { font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; padding: 12px 28px; border-radius: 0; border: 1px solid rgba(201,168,76,0.4); background: transparent; color: var(--text-muted); text-decoration: none; transition: all 0.2s; }
        .btn-back:hover { border-color: var(--gold); color: var(--gold); }
        .error-msg { color: #c0392b; font-size: 0.72rem; margin-top: 4px; display: none; }
        .form-control.is-invalid { border-color: #c0392b; }
        .form-control.is-valid { border-color: #27ae60; }
        .info-badge { background: rgba(201,168,76,0.08); border: 1px solid rgba(201,168,76,0.2); padding: 12px 16px; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 24px; }
        @media (max-width: 768px) { .main { padding: 30px 20px; } .navbar { padding: 14px 20px; } }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg d-flex align-items-center">
    <a class="navbar-brand" href="/admin/dashboard">✦ Admin Panel</a>
    <div class="d-flex gap-4 ms-4">
        <a class="nav-link" href="/admin/dashboard">Dashboard</a>
        <a class="nav-link" href="/admin/vendors">Vendors</a>
        <a class="nav-link" href="/admin/admins">Admins</a>
        <a class="nav-link" href="/admin/payments">Payments</a>
    </div>
    <div class="ms-auto">
        <a href="/admin/logout" class="btn-logout">Logout</a>
    </div>
</nav>

<div class="main">
    <div class="panel">
        <div class="panel-title">✏️ Edit Payment</div>

        <div class="info-badge">
            ℹ️ Editing payment ID: <strong th:text="${payment.id}"></strong>
            &nbsp;|&nbsp; Created: <strong th:text="${payment.createdAt}"></strong>
        </div>

        <!-- form action now points to /payments/update which is handled by admin route -->
        <form th:action="@{/payments/update}" th:object="${payment}" method="post" onsubmit="return validateEditForm()">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{createdAt}">

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Booking ID</label>
                    <input type="text" class="form-control" id="editBookingId" th:field="*{bookingId}" required>
                    <div class="error-msg" id="editBookingIdError">⚠ Booking ID cannot be empty!</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Vendor Name</label>
                    <input type="text" class="form-control" th:field="*{vendorName}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Total Amount (LKR)</label>
                    <input type="number" class="form-control" id="editTotalAmount" th:field="*{totalAmount}" step="0.01" required>
                    <div class="error-msg" id="editTotalAmountError">⚠ Total amount must be greater than 0!</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Amount Paid (LKR)</label>
                    <input type="number" class="form-control" id="editAmountPaid" th:field="*{amountPaid}" step="0.01" required>
                    <div class="error-msg" id="editAmountPaidError">⚠ Amount paid cannot exceed total amount!</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Payment Method</label>
                    <select class="form-select" th:field="*{paymentMethod}">
                        <option value="CASH">Cash</option>
                        <option value="CARD">Credit/Debit Card</option>
                        <option value="BANK_TRANSFER">Bank Transfer</option>
                        <option value="PAYHERE">PayHere</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Payment Status</label>
                    <select class="form-select" th:field="*{paymentStatus}">
                        <option value="PENDING">Pending</option>
                        <option value="PARTIAL_PAID">Partial Paid</option>
                        <option value="FULLY_PAID">Fully Paid</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Transaction ID</label>
                    <input type="text" class="form-control" th:field="*{transactionId}">
                </div>
                <div class="col-12">
                    <label class="form-label">Notes</label>
                    <textarea class="form-control" th:field="*{notes}" rows="3" placeholder="Any notes..."></textarea>
                </div>
            </div>

            <div class="d-flex gap-3 mt-4">
                <!-- Cancel goes back to admin payments, not /payments -->
                <a href="/admin/payments" class="btn-back">Cancel</a>
                <button type="submit" class="btn-gold">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function validateEditForm() {
        let isValid = true;

        const bookingId = document.getElementById('editBookingId').value.trim();
        const bookingIdError = document.getElementById('editBookingIdError');
        const bookingIdField = document.getElementById('editBookingId');
        if (!bookingId || !/^[a-zA-Z0-9\-]+$/.test(bookingId)) {
            bookingIdError.style.display = 'block';
            bookingIdField.classList.add('is-invalid');
            isValid = false;
        } else {
            bookingIdError.style.display = 'none';
            bookingIdField.classList.remove('is-invalid');
            bookingIdField.classList.add('is-valid');
        }

        const totalAmount = parseFloat(document.getElementById('editTotalAmount').value);
        const totalAmountError = document.getElementById('editTotalAmountError');
        const totalAmountField = document.getElementById('editTotalAmount');
        if (!totalAmount || totalAmount <= 0) {
            totalAmountError.style.display = 'block';
            totalAmountField.classList.add('is-invalid');
            isValid = false;
        } else {
            totalAmountError.style.display = 'none';
            totalAmountField.classList.remove('is-invalid');
            totalAmountField.classList.add('is-valid');
        }

        const amountPaid = parseFloat(document.getElementById('editAmountPaid').value);
        const amountPaidError = document.getElementById('editAmountPaidError');
        const amountPaidField = document.getElementById('editAmountPaid');
        if (!amountPaid || amountPaid <= 0 || amountPaid > totalAmount) {
            amountPaidError.style.display = 'block';
            amountPaidField.classList.add('is-invalid');
            isValid = false;
        } else {
            amountPaidError.style.display = 'none';
            amountPaidField.classList.remove('is-invalid');
            amountPaidField.classList.add('is-valid');
        }

        return isValid;
    }
</script>
</body>
</html>
