<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Wedding Planner | Vivaha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .planner-wrapper { padding-top: 120px; max-width: 1000px; margin: 0 auto; padding-bottom: 100px; }
        .planner-grid { display: grid; grid-template-columns: 1fr 300px; gap: 40px; }

        .task-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--white-alpha);
            padding: 25px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            transition: 0.3s;
        }
        .task-card:hover { border-color: var(--gold-light); background: rgba(255,255,255,0.05); }

        .task-checkbox {
            width: 24px; height: 24px;
            border: 2px solid var(--gold-light);
            margin-right: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .task-checkbox.checked { background: var(--gold-light); color: var(--dark-chocolate); }

        .task-info h5 { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; margin: 0; }
        .task-info p { font-size: 0.75rem; color: rgba(255,255,255,0.5); margin: 0; letter-spacing: 1px; }

        .sidebar-card { background: var(--gold-light); color: var(--dark-chocolate); padding: 30px; }
    </style>
</head>
<body>

<div th:replace="~{index :: nav}"></div>

<div class="container planner-wrapper">
    <header class="mb-5 text-center">
        <h2 class="editorial-title">The Wedding <em>Timeline</em></h2>
        <p class="text-white-50">Curating every detail for your perfect day.</p>
    </header>

    <div class="planner-grid">
        <div class="planner-list">
            <div class="task-card">
                <div class="task-checkbox checked"><i class="bi bi-check"></i></div>
                <div class="task-info">
                    <h5>Select Wedding Venue</h5>
                    <p>COMPLETE • DUE: JAN 2026</p>
                </div>
            </div>

            <div class="task-card">
                <div class="task-checkbox"></div>
                <div class="task-info">
                    <h5>Book Photographer & Videographer</h5>
                    <p>IN PROGRESS • DUE: MAR 2026</p>
                </div>
            </div>

            <div class="task-card">
                <div class="task-checkbox"></div>
                <div class="task-info">
                    <h5>Finalize Guest List</h5>
                    <p>PENDING • DUE: MAY 2026</p>
                </div>
            </div>

            <div class="text-center mt-4">
                <button class="btn-main-outline px-5">+ ADD CUSTOM TASK</button>
            </div>
        </div>

        <aside>
            <div class="sidebar-card">
                <h6 class="text-uppercase fw-bold mb-3" style="letter-spacing: 2px;">Status</h6>
                <div class="d-flex justify-content-between mb-2">
                    <span>Completed</span>
                    <strong>12</strong>
                </div>
                <div class="d-flex justify-content-between mb-4">
                    <span>Remaining</span>
                    <strong>08</strong>
                </div>
                <div class="progress mb-4" style="height: 4px; background: rgba(0,0,0,0.1);">
                    <div class="progress-bar bg-dark" style="width: 60%"></div>
                </div>
                <button class="btn btn-dark w-100 rounded-0 py-3" style="font-size: 0.7rem; letter-spacing: 2px;">DOWNLOAD PLANNER PDF</button>
            </div>
        </aside>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
