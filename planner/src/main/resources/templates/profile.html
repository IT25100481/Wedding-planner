<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="@{'/images/logo color.png'}">
    <title>My Profile | Vivaha Boutique</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .profile-wrapper { padding-top: 120px; max-width: 850px; margin: 0 auto; padding-bottom: 80px; }
        .detail-card { background: rgba(255,255,255,0.02); border: 1px solid var(--white-alpha); padding: 50px; margin-top: 30px; }

        .large-avatar-wrapper { position: relative; width: 130px; margin-bottom: 30px; }
        .large-avatar {
            width: 130px; height: 130px; background: #E0E0E0; color: var(--dark-chocolate);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 2.8rem; font-family: 'Cormorant Garamond', serif; border: 3px solid var(--gold-light);
            font-weight: 600;
        }

        .upload-overlay {
            position: absolute; bottom: 5px; right: 5px; background: var(--gold-light);
            border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center;
            justify-content: center; cursor: pointer; color: var(--dark-chocolate); border: 2px solid var(--dark-chocolate);
            transition: 0.3s;
        }
        .upload-overlay:hover { transform: scale(1.1); background: white; }

        .modal-content { background: var(--dark-chocolate); border: 1px solid var(--gold-light); color: white; border-radius: 0; }
        .detail-label { font-size: 0.65rem; color: var(--gold-light); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; display: block; }
        .detail-value { font-size: 1.1rem; font-weight: 300; color: white; }
        .status-badge { color: #4CAF50; font-size: 0.8rem; letter-spacing: 1px; font-weight: 600; }
    </style>
</head>
<body>

<div th:replace="~{index :: nav}"></div>

<div class="container profile-wrapper">
    <div class="text-center d-flex flex-column align-items-center">
        <div class="large-avatar-wrapper">
            <div class="large-avatar" th:text="${initials}">??</div>

            <form th:action="@{/upload-avatar}" method="post" enctype="multipart/form-data" id="avatarForm">
                <label for="avatarUpload" class="upload-overlay">
                    <i class="bi bi-camera-fill"></i>
                </label>
                <input type="file" name="avatar" id="avatarUpload" hidden onchange="document.getElementById('avatarForm').submit()">
            </form>
        </div>

        <h2 class="editorial-title">Personal <em>Account</em></h2>
        <p class="text-white-50 small">Manage your luxury wedding identity.</p>

        <div th:if="${param.updated}" class="text-success small mt-2">PROFILE UPDATED SUCCESSFULLY</div>
        <div th:if="${param.passSuccess}" class="text-success small mt-2">PASSWORD UPDATED SUCCESSFULLY</div>
        <div th:if="${param.passError}" class="text-danger small mt-2" style="color: #ff6b6b !important;">CURRENT PASSWORD INCORRECT</div>
    </div>

    <div class="detail-card shadow-lg">
        <div class="row">
            <div class="col-md-6 mb-5">
                <label class="detail-label">Full Name</label>
                <div class="d-flex justify-content-between align-items-center border-bottom border-secondary pb-2">
                    <span class="detail-value" th:text="${fullName}">Full Name</span>
                    <i class="bi bi-pencil-square text-gold-light" style="cursor:pointer" data-bs-toggle="modal" data-bs-target="#updateProfileModal"></i>
                </div>
            </div>

            <div class="col-md-6 mb-5">
                <label class="detail-label">Username</label>
                <div class="border-bottom border-secondary pb-2">
                    <span class="detail-value" th:text="'@' + ${username}">@username</span>
                </div>
            </div>

            <div class="col-md-6 mb-5">
                <label class="detail-label">Email Address</label>
                <div class="border-bottom border-secondary pb-2">
                    <span class="detail-value" th:text="${email}">your.email@gmail.com</span>
                </div>
            </div>

            <div class="col-md-6 mb-5">
                <label class="detail-label">Role</label>
                <div class="border-bottom border-secondary pb-2">
                    <span class="detail-value" th:text="${role}">Role</span>
                </div>
            </div>

            <div class="col-md-12 mb-5">
                <label class="detail-label">Membership Status</label>
                <div class="pb-2">
                    <span class="status-badge"><i class="bi bi-patch-check-fill me-1"></i> VERIFIED MEMBER</span>
                </div>
            </div>
        </div>

        <div class="text-center pt-4">
            <button class="btn-main-outline px-5 w-100" data-bs-toggle="modal" data-bs-target="#passwordModal">CHANGE PASSWORD</button>
            <div class="mt-4">
                <a href="/dashboard" class="link-gold small">← RETURN TO DASHBOARD</a>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="passwordModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <form th:action="@{/change-password}" method="post" class="modal-content p-4">
            <h4 class="editorial-title fs-3 mb-4">Change <em>Security</em></h4>
            <div class="input-group-custom">
                <label>CURRENT PASSWORD</label>
                <input type="password" name="currentPassword" placeholder="••••••••" required>
            </div>
            <div class="input-group-custom">
                <label>NEW PASSWORD</label>
                <input type="password" name="newPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-editorial-gold">UPDATE PASSWORD</button>
        </form>
    </div>
</div>

<div class="modal fade" id="updateProfileModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <form th:action="@{/update-profile}" method="post" class="modal-content p-4">
            <h4 class="editorial-title fs-3 mb-4">Update <em>Identity</em></h4>
            <div class="input-group-custom">
                <label>NEW DISPLAY NAME</label>
                <input type="text" name="fullName" th:value="${fullName}" required>
            </div>
            <button type="submit" class="btn-editorial-gold">SAVE CHANGES</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
