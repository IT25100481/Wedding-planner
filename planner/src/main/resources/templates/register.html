<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register | Kik Plus Weddings</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="luxury-card">
    <h1 class="brand-name">Kik Plus</h1>
    <p class="sub-text">PREMIUM WEDDING PLANNING</p>

    <form th:action="@{/register}" th:object="${user}" method="post">
        <input type="email" th:field="*{email}" class="input-field" placeholder="Email Address" required />

        <select th:field="*{role}" id="roleSelect" class="input-field" onchange="toggleCulture()">
            <option value="Couple">I am a Couple</option>
            <option value="Vendor">I am a Vendor</option>
        </select>

        <div id="cultureSection">
            <p style="font-size: 0.9rem; color: #d4af37;">Wedding Tradition:</p>
            <select th:field="*{style}" class="input-field">
                <option value="Sinhalese">Sinhalese</option>
                <option value="Hindu">Hindu</option>
                <option value="Muslim">Muslim</option>
                <option value="Christian">Christian</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <button type="submit" class="gold-button">CREATE ACCOUNT</button>
    </form>
</div>

<script>
    function toggleCulture() {
        const role = document.getElementById("roleSelect").value;
        document.getElementById("cultureSection").style.display = (role === 'Vendor') ? 'none' : 'block';
    }
</script>
</body>
</html>
