<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="@{'/images/logo color.png'}">
    <title>Registration | Vivaha Boutique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="split-layout-body">

<div class="split-container">
    <div class="split-visual d-none d-lg-flex">
        <div class="visual-overlay"></div>
        <div class="visual-content">
            <img th:src="@{'/images/logo color.png'}" alt="Vivaha Logo" class="reg-logo-small">
            <h2 class="brand-text">Vivaha</h2>
            <p class="brand-tagline">WHERE TRADITION MEETS LUXURY</p>
        </div>
    </div>

    <div class="split-form">
        <div class="form-wrapper">
            <header class="mb-5">
                <h3 class="editorial-title">Join the <em>Exhibition</em></h3>

                <p th:if="${param.notFound}" style="color: var(--gold-light); font-weight: 600; font-size: 0.8rem; margin-top: 10px; letter-spacing: 1px;">
                    ACCOUNT NOT FOUND. PLEASE REGISTER TO CONTINUE.
                </p>

                <p th:if="${param.notFound == null}" style="font-size: 0.85rem; color: rgba(255,255,255,0.5);">
                    Access Sri Lanka's most exclusive wedding collection.
                </p>
            </header>

            <form th:action="@{/register}" th:object="${user}" method="post" class="luxury-form">
                <div class="input-group-custom">
                    <label>FULL NAME</label>
                    <input type="text" th:field="*{fullName}" placeholder="e.g. Yakshanth Nagarathnam" required>
                </div>

                <div class="input-group-custom">
                    <label>EMAIL ADDRESS</label>
                    <input type="email" th:field="*{email}" placeholder="your@email.com" required>
                </div>

                <div class="input-group-custom">
                    <label>CREATE PASSWORD</label>
                    <input type="password" th:field="*{password}" id="password" placeholder="••••••••" required>
                </div>

                <div class="input-group-custom">
                    <label>CONFIRM PASSWORD</label>
                    <input type="password" id="confirm_password" placeholder="••••••••" required>
                </div>

                <div class="input-group-custom">
                    <label>I AM A...</label>
                    <select th:field="*{role}" id="roleSelect" class="luxury-select" required>
                        <option value="" disabled selected>Select your role</option>
                        <option value="Couple">I am a Couple</option>
                        <option value="Vendor">I am a Vendor</option>
                    </select>
                </div>

                <div class="input-group-custom d-flex align-items-center gap-2 mt-4">
                    <input type="checkbox" id="terms" style="width: 16px; height: 16px; accent-color: var(--gold-light);" required>
                    <label for="terms" class="terms-label">I ACCEPT ALL TERMS & CONDITIONS</label>
                </div>

                <button type="submit" class="btn-editorial-gold mt-3">RESERVE MY ACCOUNT</button>
            </form>

            <footer class="text-center mt-5">
                <p style="font-size: 0.8rem; color: rgba(255,255,255,0.4);">
                    ALREADY A MEMBER?
                    <a href="/login" class="link-gold">SIGN IN</a>
                </p>
            </footer>
        </div>
    </div>
</div>

<script>
    var password = document.getElementById("password"), confirm_password = document.getElementById("confirm_password");
    function validatePassword(){
      if(password.value != confirm_password.value) { confirm_password.setCustomValidity("Passwords Don't Match"); }
      else { confirm_password.setCustomValidity(''); }
    }
    password.onchange = validatePassword; confirm_password.onkeyup = validatePassword;
</script>

</body>
</html>
