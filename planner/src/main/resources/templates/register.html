<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="@{'/images/logo color.png'}">
    <title>Registration | Vivaha Boutique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="split-layout">

<div class="split-container">
    <div class="split-visual">
        <div class="visual-overlay"></div>
        <div class="visual-content">
            <img th:src="@{'/images/logo color.png'}" alt="Vivaha Logo" class="floating-logo">
            <h2 class="visual-brand">Vivaha</h2>
            <p class="visual-tag">WHERE TRADITION MEETS LUXURY</p>
        </div>
    </div>

    <div class="split-form">
        <div class="form-wrapper">
            <div class="form-header">
                <h3 class="editorial-title">Join the <em>Exhibition</em></h3>
                <p class="form-instruction">Create your profile to access our curated collection of Sri Lankan vendors.</p>
            </div>

            <form th:action="@{/register}" th:object="${user}" method="post">
                <div class="input-set">
                    <label>EMAIL ADDRESS</label>
                    <input type="email" th:field="*{email}" placeholder="your@email.com" required>
                </div>

                <div class="input-set">
                    <label>I AM A...</label>
                    <select th:field="*{role}" id="roleSelect" onchange="toggleTradition()">
                        <option value="Couple">Couple Planning a Wedding</option>
                        <option value="Vendor">Vendor Providing Services</option>
                    </select>
                </div>

                <div id="traditionSection" class="input-set">
                    <label>CULTURAL TRADITION</label>
                    <select th:field="*{style}">
                        <option value="Sinhalese">Sinhalese</option>
                        <option value="Hindu">Hindu</option>
                        <option value="Muslim">Muslim</option>
                        <option value="Christian">Christian</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <button type="submit" class="btn-editorial">RESERVE MY ACCOUNT</button>
            </form>

            <div class="form-footer">
                <span>Already a member?</span>
                <a href="/login" class="link-minimal">SIGN IN</a>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleTradition() {
        const role = document.getElementById("roleSelect").value;
        const section = document.getElementById("traditionSection");
        section.style.opacity = (role === 'Vendor') ? '0' : '1';
        section.style.pointerEvents = (role === 'Vendor') ? 'none' : 'auto';
    }
</script>
</body>
</html>
