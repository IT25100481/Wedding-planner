<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{'/images/logo color.png'}">
    <title>Registration | Vivaha Boutique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="split-container">
    <div class="split-visual d-none d-lg-flex">
        <div class="visual-overlay"></div>
        <div class="position-relative z-2 text-center">
            <img th:src="@{'/images/logo color.png'}" alt="Vivaha Logo" style="height: 100px;">
            <h2 class="brand-text" style="font-size: 4rem;">Vivaha</h2>
            <p style="letter-spacing: 5px; font-size: 0.7rem; opacity: 0.7;">WHERE TRADITION MEETS LUXURY</p>
        </div>
    </div>

    <div class="split-form">
        <div class="form-wrapper">
            <header class="mb-5">
                <h3 class="editorial-title">Join the <em>Exhibition</em></h3>
                <p style="font-size: 0.8rem; color: rgba(255,255,255,0.5);">Access Sri Lanka's most exclusive wedding collection.</p>
            </header>

            <form th:action="@{/register}" th:object="${user}" method="post">
                <div class="input-group-custom">
                    <label>EMAIL ADDRESS</label>
                    <input type="email" th:field="*{email}" placeholder="your@email.com" required>
                </div>

                <div class="input-group-custom">
                    <label>I AM A...</label>
                    <select th:field="*{role}" id="roleSelect" onchange="toggleTradition()">
                        <option value="Couple">Couple Planning a Wedding</option>
                        <option value="Vendor">Vendor Providing Services</option>
                    </select>
                </div>

                <div id="traditionSection" class="input-group-custom">
                    <label>CULTURAL TRADITION</label>
                    <select th:field="*{style}">
                        <option value="Sinhalese">Sinhalese</option>
                        <option value="Hindu">Hindu</option>
                        <option value="Muslim">Muslim</option>
                        <option value="Christian">Christian</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <button type="submit" class="btn-editorial-gold">RESERVE MY ACCOUNT</button>
            </form>

            <p class="text-center mt-4" style="font-size: 0.8rem; opacity: 0.5;">
                Already a member? <a href="/login" style="color: var(--gold-light); text-decoration: none;">SIGN IN</a>
            </p>
        </div>
    </div>
</div>

<script>
    function toggleTradition() {
        const role = document.getElementById("roleSelect").value;
        const section = document.getElementById("traditionSection");
        section.style.opacity = (role === 'Vendor') ? '0.3' : '1';
    }
</script>
</body>
</html>
