<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="@{'/images/logo color.png'}">
    <title>Secure Access Reset | VIVAHA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        :root {
            --boutique-black: #1a1209;
            --gold-soft: #e5b27d;
            --white-subtle: rgba(255, 255, 255, 0.85);
            --border-light: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--boutique-black);
            color: white;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        /* Subtle ambient background effect */
        .ambient-glow {
            position: absolute;
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, rgba(229, 178, 125, 0.03) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .editorial-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .est-tag {
            font-size: 0.6rem;
            letter-spacing: 5px;
            color: var(--gold-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .est-tag .line {
            width: 30px;
            height: 1px;
            background: rgba(229, 178, 125, 0.3);
        }

        .page-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: -1px;
        }

        .page-title em {
            font-style: italic;
            color: var(--gold-soft);
        }

        .form-wrapper {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border-light);
            padding: 60px 50px;
            backdrop-filter: blur(10px);
        }

        .input-label {
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            margin-bottom: 12px;
            display: block;
        }

        .boutique-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            border-radius: 0;
            color: white;
            padding: 12px 0;
            font-size: 1rem;
            font-weight: 200;
            transition: 0.4s;
            margin-bottom: 40px;
        }

        .boutique-input:focus {
            outline: none;
            border-bottom-color: var(--gold-soft);
            padding-left: 10px;
        }

        .btn-update {
            background: transparent;
            border: 1px solid var(--gold-soft);
            color: var(--gold-soft);
            width: 100%;
            padding: 18px;
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
        }

        .btn-update:hover {
            background: var(--gold-soft);
            color: var(--boutique-black);
        }

        .security-badge {
            margin-top: 40px;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.25);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 30px;
            font-size: 0.65rem;
            color: rgba(255,255,255,0.3);
            text-decoration: none;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .back-link:hover {
            color: var(--gold-soft);
        }
    </style>
</head>
<body>

<div class="ambient-glow"></div>

<div class="editorial-container">

    <div class="auth-header">
        <div class="est-tag">
            <span class="line"></span> SECURITY PROTOCOL <span class="line"></span>
        </div>
        <h1 class="page-title">Refining Your <em>Access</em></h1>
    </div>

    <div class="form-wrapper">
        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" name="email" th:value="${email}">
            <input type="hidden" name="token" th:value="${token}">

            <label class="input-label">Identity Verified</label>
            <p class="small mb-5" style="color: var(--gold-soft); border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px;">
                <i class="bi bi-shield-check me-2"></i> <span th:text="${email}">user@example.com</span>
            </p>

            <label class="input-label" for="newPassword">New Vault Password</label>
            <input type="password" id="newPassword" name="newPassword"
                   class="boutique-input" placeholder="Enter new credentials" required autofocus>

            <button type="submit" class="btn-update">
                Update Security Archive
            </button>
        </form>

        <div class="security-badge">
            <i class="bi bi-incognito"></i> END-TO-END ENCRYPTION ACTIVE
        </div>
    </div>

    <a th:href="@{/login}" class="back-link">
        <i class="bi bi-chevron-left"></i> RETURN TO PORTAL
    </a>

</div>

<script>
    // Subtle entrance animation
    document.addEventListener('DOMContentLoaded', () => {
        const wrapper = document.querySelector('.form-wrapper');
        wrapper.style.opacity = '0';
        wrapper.style.transform = 'translateY(20px)';

        setTimeout(() => {
            wrapper.style.transition = 'all 1s cubic-bezier(0.2, 1, 0.3, 1)';
            wrapper.style.opacity = '1';
            wrapper.style.transform = 'translateY(0)';
        }, 100);
    });
</script>
</body>
</html>
