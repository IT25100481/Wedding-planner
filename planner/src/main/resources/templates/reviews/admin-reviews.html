<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Reviews | Admin | Vivaha Boutique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c9a84c; --gold-dark: #9a7a2e; --cream: #fdf8f2; --dark: #1a1209; --text-muted: #7a6a50; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--cream); font-family: 'Montserrat', sans-serif; font-weight: 300; }

        .navbar { background: var(--dark); padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; }
        .navbar-brand { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; color: var(--gold); letter-spacing: 3px; text-decoration: none; }
        .nav-link { color: rgba(255,255,255,0.75); font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; margin-left: 24px; }
        .nav-link:hover, .nav-link.active { color: var(--gold); }
        .btn-logout { background: transparent; border: 1px solid rgba(201,168,76,0.5); color: var(--gold); font-size: 0.68rem; letter-spacing: 2px; text-transform: uppercase; padding: 6px 16px; text-decoration: none; margin-left: 24px; }
        .btn-logout:hover { background: rgba(201,168,76,0.1); color: var(--gold); }

        .main { padding: 50px 80px; }
        .page-tag   { font-size: 0.62rem; letter-spacing: 5px; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
        .page-title { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 300; color: var(--dark); margin-bottom: 32px; }

        /* Stats strip */
        .stats-strip { display: flex; gap: 20px; margin-bottom: 36px; flex-wrap: wrap; }
        .stat-box { background: #fff; border: 1px solid rgba(201,168,76,0.2); padding: 20px 28px; flex: 1; min-width: 140px; }
        .stat-val   { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; color: var(--gold); font-weight: 300; }
        .stat-lbl   { font-size: 0.62rem; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); margin-top: 4px; }

        /* Table */
        .panel { background: #fff; border: 1px solid rgba(201,168,76,0.2); padding: 0; overflow: hidden; }
        .panel-head { padding: 20px 28px; border-bottom: 1px solid rgba(201,168,76,0.15); display: flex; justify-content: space-between; align-items: center; }
        .panel-title { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 400; color: var(--dark); }

        table { width: 100%; border-collapse: collapse; }
        th { font-size: 0.62rem; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); padding: 14px 20px; text-align: left; border-bottom: 1px solid rgba(201,168,76,0.15); background: #fdfaf5; }
        td { padding: 16px 20px; border-bottom: 1px solid rgba(201,168,76,0.08); font-size: 0.82rem; color: var(--dark); vertical-align: top; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(201,168,76,0.02); }

        .stars { color: var(--gold); }
        .star-empty { color: #d6cfc4; }

        .badge-pending  { background: rgba(255,193,7,0.15);  color: #856404; font-size: 0.62rem; letter-spacing: 2px; text-transform: uppercase; padding: 4px 10px; border: 1px solid rgba(255,193,7,0.4); white-space:nowrap; }
        .badge-approved { background: rgba(25,135,84,0.1);   color: #146c43; font-size: 0.62rem; letter-spacing: 2px; text-transform: uppercase; padding: 4px 10px; border: 1px solid rgba(25,135,84,0.3); white-space:nowrap; }
        .badge-rejected { background: rgba(220,53,69,0.1);   color: #b02a37; font-size: 0.62rem; letter-spacing: 2px; text-transform: uppercase; padding: 4px 10px; border: 1px solid rgba(220,53,69,0.3); white-space:nowrap; }

        .comment-cell { max-width: 280px; font-style: italic; color: var(--text-muted); }

        .action-btn { font-size: 0.62rem; letter-spacing: 1px; text-transform: uppercase; padding: 6px 14px; border: none; cursor: pointer; margin-right: 6px; margin-bottom: 4px; font-family: 'Montserrat', sans-serif; transition: all 0.25s; }
        .btn-approve { background: rgba(25,135,84,0.1); color: #146c43; border: 1px solid rgba(25,135,84,0.3); }
        .btn-approve:hover { background: rgba(25,135,84,0.2); }
        .btn-reject  { background: rgba(255,193,7,0.1);  color: #856404; border: 1px solid rgba(255,193,7,0.4); }
        .btn-reject:hover  { background: rgba(255,193,7,0.2); }
        .btn-del     { background: rgba(220,53,69,0.1);  color: #b02a37; border: 1px solid rgba(220,53,69,0.3); }
        .btn-del:hover     { background: rgba(220,53,69,0.2); }

        .alert-success { background: rgba(201,168,76,0.1); border: 1px solid rgba(201,168,76,0.4); color: var(--dark); border-radius: 0; font-size: 0.85rem; margin-bottom: 24px; }
        .alert-danger  { border-radius: 0; font-size: 0.85rem; margin-bottom: 24px; }

        .empty-text { text-align: center; padding: 50px; font-size: 0.85rem; color: var(--text-muted); }

        @media (max-width: 768px) { .main { padding: 30px 20px; } .navbar { padding: 14px 20px; } }
    </style>
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" href="/admin/dashboard">✦ Admin Panel</a>
    <div>
        <a class="nav-link" href="/admin/dashboard">Dashboard</a>
        <a class="nav-link" href="/admin/vendors">Vendors</a>
        <a class="nav-link" href="/admin/admins">Admins</a>
        <a class="nav-link active" href="/admin/reviews">Reviews</a>
    </div>
    <a href="/admin/logout" class="btn-logout">Logout</a>
</nav>

<div class="main">
    <div class="page-tag">Admin Panel</div>
    <div class="page-title">Manage Reviews</div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}"   class="alert alert-danger"  th:text="${error}"></div>

    <!-- Stats -->
    <div class="stats-strip">
        <div class="stat-box">
            <div class="stat-val" th:text="${reviews.size()}">0</div>
            <div class="stat-lbl">Total Reviews</div>
        </div>
        <div class="stat-box">
            <div class="stat-val" th:text="${reviews.stream().filter(r -> r.status == 'PENDING').count()}">0</div>
            <div class="stat-lbl">Pending</div>
        </div>
        <div class="stat-box">
            <div class="stat-val" th:text="${reviews.stream().filter(r -> r.status == 'APPROVED').count()}">0</div>
            <div class="stat-lbl">Approved</div>
        </div>
        <div class="stat-box">
            <div class="stat-val" th:text="${avgRating > 0} ? ${#numbers.formatDecimal(avgRating,1,1)} + '★' : 'N/A'">N/A</div>
            <div class="stat-lbl">Avg Rating</div>
        </div>
    </div>

    <!-- Table -->
    <div class="panel">
        <div class="panel-head">
            <div class="panel-title">All Submitted Reviews</div>
        </div>

        <div th:if="${reviews.isEmpty()}" class="empty-text">No reviews yet.</div>

        <table th:if="${!reviews.isEmpty()}">
            <thead>
                <tr>
                    <th>Customer</th>
                    <th>Service</th>
                    <th>Rating</th>
                    <th>Comment</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${reviews}">
                    <td>
                        <div th:text="${r.fullName}"></div>
                        <div style="font-size:0.72rem;color:var(--text-muted);" th:text="${r.userId}"></div>
                    </td>
                    <td>
                        <div th:text="${r.serviceType}"></div>
                        <div style="font-size:0.72rem;color:var(--text-muted);" th:text="${r.vendorName}"></div>
                    </td>
                    <td>
                        <span class="stars">
                            <th:block th:each="i : ${#numbers.sequence(1, r.rating)}">★</th:block>
                        </span>
                        <span class="star-empty">
                            <th:block th:each="i : ${#numbers.sequence(r.rating + 1, 5)}">★</th:block>
                        </span>
                    </td>
                    <td class="comment-cell" th:text="${r.comment}"></td>
                    <td th:text="${r.createdAt}"></td>
                    <td>
                        <span th:if="${r.status == 'PENDING'}"  class="badge-pending">Pending</span>
                        <span th:if="${r.status == 'APPROVED'}" class="badge-approved">Approved</span>
                        <span th:if="${r.status == 'REJECTED'}" class="badge-rejected">Rejected</span>
                    </td>
                    <td>
                        <!-- Approve -->
                        <form th:if="${r.status != 'APPROVED'}"
                              th:action="@{/admin/reviews/approve/{id}(id=${r.id})}" method="post" style="display:inline;">
                            <button type="submit" class="action-btn btn-approve">Approve</button>
                        </form>
                        <!-- Reject -->
                        <form th:if="${r.status != 'REJECTED'}"
                              th:action="@{/admin/reviews/reject/{id}(id=${r.id})}" method="post" style="display:inline;">
                            <button type="submit" class="action-btn btn-reject">Reject</button>
                        </form>
                        <!-- Delete -->
                        <form th:action="@{/admin/reviews/delete/{id}(id=${r.id})}" method="post" style="display:inline;"
                              onsubmit="return confirm('Permanently delete this review?')">
                            <button type="submit" class="action-btn btn-del">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
