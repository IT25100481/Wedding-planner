<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Review | Vivaha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold:#c9a84c; --gold-dark:#9a7a2e; --cream:#fdf8f2; --dark:#1a1209; --muted:#7a6a50; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--cream); font-family:'Montserrat',sans-serif; font-weight:300; }

        .topbar { background:var(--dark); padding:16px 40px; display:flex; align-items:center; justify-content:space-between; }
        .brand  { font-family:'Cormorant Garamond',serif; font-size:1.5rem; color:var(--gold); letter-spacing:3px; text-decoration:none; }
        .nav-a  { color:rgba(255,255,255,.7); font-size:0.72rem; letter-spacing:2px; text-transform:uppercase; text-decoration:none; margin-left:22px; }
        .nav-a:hover { color:var(--gold); }

        .hero { background:var(--dark); padding:56px 0 36px; text-align:center; }
        .hero-tag   { font-size:0.62rem; letter-spacing:5px; text-transform:uppercase; color:var(--gold); margin-bottom:10px; }
        .hero-title { font-family:'Cormorant Garamond',serif; font-size:2.6rem; font-weight:300; color:#fff; }

        .wrap { max-width:680px; margin:56px auto; padding:0 20px 80px; }

        .notice { background:rgba(201,168,76,.08); border:1px solid rgba(201,168,76,.3); padding:13px 18px;
                  font-size:0.78rem; color:var(--muted); margin-bottom:28px; }

        .card { background:#fff; border:1px solid rgba(201,168,76,.22); padding:44px; }

        .lbl { font-size:0.68rem; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; display:block; }

        .inp, textarea { width:100%; border:1px solid rgba(201,168,76,.3); border-radius:0;
            font-family:'Montserrat',sans-serif; font-weight:300; font-size:0.88rem;
            padding:11px 14px; background:#fdfaf5; color:var(--dark); box-sizing:border-box; }
        .inp:focus, textarea:focus { outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,168,76,.1); background:#fff; }
        textarea { min-height:130px; resize:vertical; }
        .readonly { background:#f0ece4; color:var(--muted); cursor:not-allowed; }

        .stars { display:flex; flex-direction:row-reverse; justify-content:flex-end; gap:4px; }
        .stars input[type=radio] { display:none; }
        .stars label { font-size:2.2rem; color:#d6cfc4; cursor:pointer; transition:color .15s; }
        .stars input:checked ~ label,
        .stars label:hover,
        .stars label:hover ~ label { color:var(--gold); }

        .divider { border:none; border-top:1px solid rgba(201,168,76,.18); margin:28px 0; }

        .btn-save { background:var(--gold); color:var(--dark); border:none; border-radius:0;
            font-size:0.7rem; letter-spacing:3px; text-transform:uppercase;
            padding:13px 38px; font-family:'Montserrat',sans-serif; font-weight:600;
            cursor:pointer; transition:background .3s; }
        .btn-save:hover { background:var(--gold-dark); }
        .back { font-size:0.7rem; letter-spacing:2px; text-transform:uppercase; color:var(--gold); text-decoration:none; }
        .back:hover { color:var(--gold-dark); }

        .alert-err { background:rgba(220,53,69,.08); border:1px solid rgba(220,53,69,.35); color:#842029; border-radius:0; padding:12px 16px; margin-bottom:20px; font-size:.85rem; }
    </style>
</head>
<body>

<nav class="topbar">
    <a class="brand" href="/dashboard">✦ Vivaha</a>
    <div>
        <a class="nav-a" href="/dashboard">Dashboard</a>
        <a class="nav-a" href="/reviews/my-reviews">My Reviews</a>
        <a class="nav-a" href="/logout">Logout</a>
    </div>
</nav>

<div class="hero">
    <div class="hero-tag">Update Feedback</div>
    <div class="hero-title">Edit Your Review</div>
</div>

<div class="wrap">

    <div class="notice">⚠ Editing your review resets its status to <strong>Pending</strong> until re-approved by the admin.</div>

    <div th:if="${error}" class="alert-err" th:text="${error}"></div>

    <div class="card">
        <form th:action="@{/reviews/edit/{id}(id=${review.id})}" method="post">

            <!-- Read-only service info -->
            <div class="mb-4">
                <label class="lbl">Service</label>
                <input type="text" class="inp readonly" th:value="${review.serviceType}" readonly>
                <input type="hidden" name="serviceType" th:value="${review.serviceType}">
            </div>

            <div class="mb-4" th:if="${review.vendorName != null and !review.vendorName.isEmpty()}">
                <label class="lbl">Vendor</label>
                <input type="text" class="inp readonly" th:value="${review.vendorName}" readonly>
            </div>

            <div class="divider"></div>

            <!-- Editable: Stars -->
            <div class="mb-4">
                <label class="lbl">Update Your Rating *</label>
                <div class="stars">
                    <input type="radio" id="s5" name="rating" value="5" th:checked="${review.rating == 5}"><label for="s5">★</label>
                    <input type="radio" id="s4" name="rating" value="4" th:checked="${review.rating == 4}"><label for="s4">★</label>
                    <input type="radio" id="s3" name="rating" value="3" th:checked="${review.rating == 3}"><label for="s3">★</label>
                    <input type="radio" id="s2" name="rating" value="2" th:checked="${review.rating == 2}"><label for="s2">★</label>
                    <input type="radio" id="s1" name="rating" value="1" th:checked="${review.rating == 1}"><label for="s1">★</label>
                </div>
            </div>

            <!-- Editable: Comment -->
            <div class="mb-4">
                <label class="lbl" for="comment">Update Your Comment *</label>
                <textarea id="comment" name="comment" class="inp"
                          th:text="${review.comment}" required></textarea>
            </div>

            <div class="divider"></div>

            <div class="d-flex align-items-center justify-content-between">
                <a href="/reviews/my-reviews" class="back">← Cancel</a>
                <button type="submit" class="btn-save">Save Changes</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
