<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reviews | Vivaha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold:#c9a84c; --gold-dark:#9a7a2e; --cream:#fdf8f2; --dark:#1a1209; --muted:#7a6a50; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--cream); font-family:'Montserrat',sans-serif; font-weight:300; }

        .topbar { background:var(--dark); padding:16px 40px; display:flex; align-items:center; justify-content:space-between; }
        .brand  { font-family:'Cormorant Garamond',serif; font-size:1.5rem; color:var(--gold); letter-spacing:3px; text-decoration:none; }
        .nav-a  { color:rgba(255,255,255,.7); font-size:0.72rem; letter-spacing:2px; text-transform:uppercase; text-decoration:none; margin-left:22px; }
        .nav-a:hover { color:var(--gold); }

        .hero { background:var(--dark); padding:56px 0 36px; text-align:center; }
        .hero-tag   { font-size:0.62rem; letter-spacing:5px; text-transform:uppercase; color:var(--gold); margin-bottom:10px; }
        .hero-title { font-family:'Cormorant Garamond',serif; font-size:2.6rem; font-weight:300; color:#fff; }

        .wrap { max-width:820px; margin:56px auto; padding:0 20px 80px; }

        .top-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; }
        .count    { font-size:0.78rem; color:var(--muted); }

        .btn-new {
            background:var(--gold); color:var(--dark); text-decoration:none;
            font-size:0.68rem; letter-spacing:3px; text-transform:uppercase;
            padding:11px 26px; font-weight:600; transition:background .3s; display:inline-block;
        }
        .btn-new:hover { background:var(--gold-dark); color:var(--dark); }

        .rcard { background:#fff; border:1px solid rgba(201,168,76,.2); padding:28px 32px; margin-bottom:18px; transition:border-color .3s; }
        .rcard:hover { border-color:rgba(201,168,76,.5); }

        .rcard-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
        .service-name { font-family:'Cormorant Garamond',serif; font-size:1.35rem; color:var(--dark); }
        .vendor-name  { font-size:0.76rem; color:var(--muted); margin-top:2px; }

        .stars-display { color:var(--gold); font-size:1.15rem; }
        .stars-empty   { color:#d6cfc4; }

        .badge { font-size:0.6rem; letter-spacing:2px; text-transform:uppercase; padding:4px 10px; border:1px solid; display:inline-block; }
        .badge-PENDING  { background:rgba(255,193,7,.12);  color:#856404; border-color:rgba(255,193,7,.4); }
        .badge-APPROVED { background:rgba(25,135,84,.1);   color:#146c43; border-color:rgba(25,135,84,.3); }
        .badge-REJECTED { background:rgba(220,53,69,.08);  color:#b02a37; border-color:rgba(220,53,69,.3); }

        .comment { font-size:0.88rem; color:var(--dark); line-height:1.75; margin:14px 0;
                   padding:14px 18px; background:#fdfaf5; border-left:3px solid var(--gold); font-style:italic; }
        .date    { font-size:0.7rem; color:var(--muted); margin-top:10px; }

        .actions { display:flex; gap:10px; margin-top:14px; }
        .btn-edit { font-size:0.65rem; letter-spacing:2px; text-transform:uppercase; padding:7px 18px;
                    border:1px solid var(--gold); color:var(--gold); background:transparent; text-decoration:none; transition:all .25s; }
        .btn-edit:hover { background:var(--gold); color:var(--dark); }
        .btn-del  { font-size:0.65rem; letter-spacing:2px; text-transform:uppercase; padding:7px 18px;
                    border:1px solid rgba(220,53,69,.5); color:#dc3545; background:transparent; cursor:pointer; transition:all .25s; }
        .btn-del:hover { background:#dc3545; color:#fff; border-color:#dc3545; }

        .empty { text-align:center; padding:70px 40px; background:#fff; border:1px solid rgba(201,168,76,.2); }
        .empty-icon { font-size:2.8rem; color:rgba(201,168,76,.3); margin-bottom:14px; }
        .empty-text { font-family:'Cormorant Garamond',serif; font-size:1.4rem; color:var(--muted); }

        .alert-ok  { background:rgba(201,168,76,.1); border:1px solid rgba(201,168,76,.4); color:var(--dark); border-radius:0; padding:12px 16px; margin-bottom:20px; font-size:.85rem; }
        .alert-err { background:rgba(220,53,69,.08); border:1px solid rgba(220,53,69,.35); color:#842029; border-radius:0; padding:12px 16px; margin-bottom:20px; font-size:.85rem; }
    </style>
</head>
<body>

<nav class="topbar">
    <a class="brand" href="/dashboard">✦ Vivaha</a>
    <div>
        <a class="nav-a" href="/dashboard">Dashboard</a>
        <a class="nav-a" href="/reviews/submit">Write Review</a>
        <a class="nav-a" href="/reviews">All Reviews</a>
        <a class="nav-a" href="/logout">Logout</a>
    </div>
</nav>

<div class="hero">
    <div class="hero-tag">Review History</div>
    <div class="hero-title">My Reviews</div>
</div>

<div class="wrap">

    <div th:if="${success}" class="alert-ok" th:text="${success}"></div>
    <div th:if="${error}"   class="alert-err" th:text="${error}"></div>

    <div class="top-row">
        <span class="count" th:text="${reviews.size()} + ' review(s) submitted'"></span>
        <a href="/reviews/submit" class="btn-new">+ Write New Review</a>
    </div>

    <!-- Empty state -->
    <div th:if="${reviews.isEmpty()}" class="empty">
        <div class="empty-icon">✦</div>
        <div class="empty-text">No reviews yet</div>
        <p style="font-size:.78rem;color:var(--muted);margin-top:8px;">Share your experience after a completed payment.</p>
        <a href="/reviews/submit" class="btn-new" style="margin-top:22px; display:inline-block;">Write Your First Review</a>
    </div>

    <!-- Review cards -->
    <div th:each="r : ${reviews}" class="rcard">
        <div class="rcard-top">
            <div>
                <div class="service-name" th:text="${r.serviceType}">Service</div>
                <div class="vendor-name"
                     th:if="${r.vendorName != null and !r.vendorName.isEmpty()}"
                     th:text="'by ' + ${r.vendorName}"></div>
            </div>
            <span th:class="'badge badge-' + ${r.status}" th:text="${r.status}">PENDING</span>
        </div>

        <!-- Stars -->
        <div class="stars-display">
            <th:block th:each="i : ${#numbers.sequence(1, r.rating)}">★</th:block>
            <span class="stars-empty">
                <th:block th:each="i : ${#numbers.sequence(r.rating + 1, 5)}">★</th:block>
            </span>
        </div>

        <div class="comment" th:text="${r.comment}"></div>
        <div class="date" th:text="'Submitted: ' + ${r.createdAt}"></div>

        <div class="actions">
            <a th:href="@{/reviews/edit/{id}(id=${r.id})}" class="btn-edit">Edit</a>
            <form th:action="@{/reviews/delete/{id}(id=${r.id})}" method="post"
                  onsubmit="return confirm('Delete this review? This cannot be undone.')">
                <button type="submit" class="btn-del">Delete</button>
            </form>
        </div>
    </div>

</div>
</body>
</html>
