<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reviews | Vivaha Boutique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c9a84c; --gold-dark: #9a7a2e; --cream: #fdf8f2; --dark: #1a1209; --text-muted: #7a6a50; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--cream); font-family: 'Montserrat', sans-serif; font-weight: 300; }

        .navbar { background: var(--dark); padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; }
        .navbar-brand { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; color: var(--gold); letter-spacing: 3px; text-decoration: none; }
        .nav-link { color: rgba(255,255,255,0.75); font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; margin-left: 24px; }
        .nav-link:hover { color: var(--gold); }

        .hero { background: var(--dark); padding: 60px 0 40px; text-align: center; }
        .hero-tag   { font-size: 0.62rem; letter-spacing: 5px; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
        .hero-title { font-family: 'Cormorant Garamond', serif; font-size: 2.8rem; font-weight: 300; color: #fff; }

        .main { max-width: 860px; margin: 60px auto; padding: 0 20px 80px; }

        .btn-gold {
            background: var(--gold); color: var(--dark); border: none; border-radius: 0;
            font-size: 0.68rem; letter-spacing: 3px; text-transform: uppercase;
            padding: 12px 30px; font-family: 'Montserrat', sans-serif; font-weight: 600;
            cursor: pointer; transition: background 0.3s; text-decoration: none; display: inline-block;
        }
        .btn-gold:hover { background: var(--gold-dark); color: var(--dark); }

        .review-card { background: #fff; border: 1px solid rgba(201,168,76,0.2); padding: 32px; margin-bottom: 20px; transition: border-color 0.3s; }
        .review-card:hover { border-color: rgba(201,168,76,0.5); }

        .review-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
        .review-service { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; color: var(--dark); }
        .review-vendor  { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
        .stars { color: var(--gold); font-size: 1.2rem; }
        .star-empty { color: #d6cfc4; }

        .badge-pending  { background: rgba(255,193,7,0.15);  color: #856404; font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; padding: 4px 10px; border: 1px solid rgba(255,193,7,0.4); }
        .badge-approved { background: rgba(25,135,84,0.1);   color: #146c43; font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; padding: 4px 10px; border: 1px solid rgba(25,135,84,0.3); }
        .badge-rejected { background: rgba(220,53,69,0.1);   color: #b02a37; font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; padding: 4px 10px; border: 1px solid rgba(220,53,69,0.3); }

        .review-comment { font-size: 0.9rem; color: var(--dark); line-height: 1.7; margin: 16px 0; padding: 16px; background: #fdfaf5; border-left: 3px solid var(--gold); }
        .review-date  { font-size: 0.72rem; color: var(--text-muted); margin-top: 12px; }

        .review-actions { display: flex; gap: 10px; margin-top: 16px; }
        .btn-edit { font-size: 0.68rem; letter-spacing: 2px; text-transform: uppercase; padding: 8px 20px; border: 1px solid var(--gold); color: var(--gold); background: transparent; text-decoration: none; transition: all 0.3s; }
        .btn-edit:hover { background: var(--gold); color: var(--dark); }
        .btn-delete { font-size: 0.68rem; letter-spacing: 2px; text-transform: uppercase; padding: 8px 20px; border: 1px solid rgba(220,53,69,0.5); color: #dc3545; background: transparent; cursor: pointer; transition: all 0.3s; }
        .btn-delete:hover { background: #dc3545; color: #fff; border-color: #dc3545; }

        .empty-state { text-align: center; padding: 80px 40px; background: #fff; border: 1px solid rgba(201,168,76,0.2); }
        .empty-icon  { font-size: 3rem; color: rgba(201,168,76,0.3); margin-bottom: 16px; }
        .empty-text  { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; color: var(--text-muted); }
        .empty-sub   { font-size: 0.8rem; color: var(--text-muted); margin-top: 8px; }

        .alert-success { background: rgba(201,168,76,0.1); border: 1px solid rgba(201,168,76,0.4); color: var(--dark); border-radius: 0; font-size: 0.85rem; }
        .alert-danger  { border-radius: 0; font-size: 0.85rem; }
    </style>
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" href="/dashboard">✦ Vivaha Boutique</a>
    <div>
        <a class="nav-link" href="/dashboard">Dashboard</a>
        <a class="nav-link" href="/reviews/submit">Submit Review</a>
        <a class="nav-link" href="/reviews">All Reviews</a>
        <a class="nav-link" href="/logout">Logout</a>
    </div>
</nav>

<div class="hero">
    <div class="hero-tag">Review History</div>
    <div class="hero-title">My Reviews</div>
</div>

<div class="main">

    <div th:if="${success}" class="alert alert-success mb-4" th:text="${success}"></div>
    <div th:if="${error}"   class="alert alert-danger mb-4"  th:text="${error}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <p style="font-size:0.8rem;color:var(--text-muted);"
           th:text="${reviews.size()} + ' review(s) submitted'"></p>
        <a href="/reviews/submit" class="btn-gold">+ New Review</a>
    </div>

    <!-- Empty state -->
    <div th:if="${reviews.isEmpty()}" class="empty-state">
        <div class="empty-icon">✦</div>
        <div class="empty-text">No reviews yet</div>
        <div class="empty-sub">Share your experience with our services</div>
        <a href="/reviews/submit" class="btn-gold mt-4" style="margin-top:24px;">Write Your First Review</a>
    </div>

    <!-- Review cards -->
    <div th:each="r : ${reviews}" class="review-card">
        <div class="review-header">
            <div>
                <div class="review-service" th:text="${r.serviceType}">Photography</div>
                <div class="review-vendor" th:if="${r.vendorName != null and !r.vendorName.isEmpty()}"
                     th:text="'By ' + ${r.vendorName}"></div>
            </div>
            <div>
                <!-- Status badge -->
                <span th:if="${r.status == 'PENDING'}"  class="badge-pending">Pending</span>
                <span th:if="${r.status == 'APPROVED'}" class="badge-approved">Approved</span>
                <span th:if="${r.status == 'REJECTED'}" class="badge-rejected">Rejected</span>
            </div>
        </div>

        <!-- Star display -->
        <div class="stars">
            <th:block th:each="i : ${#numbers.sequence(1, r.rating)}">★</th:block>
            <span class="star-empty">
                <th:block th:each="i : ${#numbers.sequence(r.rating + 1, 5)}">★</th:block>
            </span>
        </div>

        <div class="review-comment" th:text="${r.comment}"></div>
        <div class="review-date" th:text="'Submitted: ' + ${r.createdAt}"></div>

        <!-- Actions (only allow edit/delete if not approved) -->
        <div class="review-actions">
            <a th:if="${r.status != 'APPROVED'}" th:href="@{/reviews/edit/{id}(id=${r.id})}"
               class="btn-edit">Edit</a>
            <form th:action="@{/reviews/delete/{id}(id=${r.id})}" method="post" style="display:inline;"
                  onsubmit="return confirm('Delete this review?')">
                <button type="submit" class="btn-delete">Delete</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
