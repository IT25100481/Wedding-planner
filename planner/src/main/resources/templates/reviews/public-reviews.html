<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews | Vivaha Boutique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c9a84c; --gold-dark: #9a7a2e; --cream: #fdf8f2; --dark: #1a1209; --text-muted: #7a6a50; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--cream); font-family: 'Montserrat', sans-serif; font-weight: 300; }

        .navbar { background: var(--dark); padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; }
        .navbar-brand { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; color: var(--gold); letter-spacing: 3px; text-decoration: none; }
        .nav-link { color: rgba(255,255,255,0.75); font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; margin-left: 24px; }
        .nav-link:hover { color: var(--gold); }

        .hero { background: var(--dark); padding: 80px 0 60px; text-align: center; }
        .hero-tag   { font-size: 0.62rem; letter-spacing: 5px; text-transform: uppercase; color: var(--gold); margin-bottom: 14px; }
        .hero-title { font-family: 'Cormorant Garamond', serif; font-size: 3.2rem; font-weight: 300; color: #fff; margin-bottom: 20px; }
        .hero-avg   { font-size: 2.5rem; color: var(--gold); }
        .hero-avg-label { font-size: 0.72rem; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-top: 6px; }

        .main { max-width: 900px; margin: 60px auto; padding: 0 20px 80px; }

        .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 36px; }
        .filter-btn { font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; padding: 8px 20px; border: 1px solid rgba(201,168,76,0.4); color: var(--text-muted); background: transparent; cursor: pointer; transition: all 0.3s; }
        .filter-btn:hover, .filter-btn.active { background: var(--gold); color: var(--dark); border-color: var(--gold); }

        .review-card { background: #fff; border: 1px solid rgba(201,168,76,0.2); padding: 36px; margin-bottom: 24px; transition: all 0.3s; }
        .review-card:hover { border-color: rgba(201,168,76,0.5); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.06); }

        .review-top  { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
        .reviewer-name { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; color: var(--dark); }
        .review-meta   { font-size: 0.72rem; color: var(--text-muted); margin-top: 3px; }
        .stars { color: var(--gold); font-size: 1.1rem; }
        .star-empty { color: #d6cfc4; }

        .review-service-tag { display: inline-block; font-size: 0.62rem; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); border: 1px solid rgba(201,168,76,0.4); padding: 3px 10px; margin-bottom: 14px; }
        .review-comment { font-size: 0.9rem; color: var(--dark); line-height: 1.75; font-style: italic; padding-left: 16px; border-left: 3px solid rgba(201,168,76,0.4); }
        .opening-quote { font-family: 'Cormorant Garamond', serif; font-size: 2rem; color: var(--gold); line-height: 0.5; vertical-align: -0.5em; margin-right: 4px; }

        .empty-state { text-align: center; padding: 80px 40px; background: #fff; border: 1px solid rgba(201,168,76,0.2); }
        .empty-icon { font-size: 3rem; color: rgba(201,168,76,0.3); margin-bottom: 16px; }
        .empty-text { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; color: var(--text-muted); }

        .btn-gold { background: var(--gold); color: var(--dark); border: none; border-radius: 0; font-size: 0.68rem; letter-spacing: 3px; text-transform: uppercase; padding: 12px 30px; font-family: 'Montserrat', sans-serif; font-weight: 600; cursor: pointer; transition: background 0.3s; text-decoration: none; display: inline-block; }
        .btn-gold:hover { background: var(--gold-dark); color: var(--dark); }
    </style>
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" href="/">✦ Vivaha Boutique</a>
    <div>
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link" href="/dashboard">Dashboard</a>
        <a class="nav-link" href="/reviews/submit">Write a Review</a>
    </div>
</nav>

<!-- HERO -->
<div class="hero">
    <div class="hero-tag">Client Testimonials</div>
    <div class="hero-title">What Our Couples Say</div>
    <div th:if="${avgRating > 0}">
        <div class="hero-avg">
            <th:block th:each="i : ${#numbers.sequence(1, T(java.lang.Math).round(avgRating))}">★</th:block>
            &nbsp;<span style="font-family:'Montserrat';font-size:1.6rem;" th:text="${#numbers.formatDecimal(avgRating,1,1)}"></span>
        </div>
        <div class="hero-avg-label" th:text="${reviews.size()} + ' verified reviews'"></div>
    </div>
</div>

<div class="main">

    <!-- Filter buttons (JS-powered) -->
    <div class="filter-bar">
        <button class="filter-btn active" onclick="filterReviews('all', this)">All</button>
        <button class="filter-btn" onclick="filterReviews('Photography', this)">Photography</button>
        <button class="filter-btn" onclick="filterReviews('Catering', this)">Catering</button>
        <button class="filter-btn" onclick="filterReviews('Floral Decoration', this)">Floral</button>
        <button class="filter-btn" onclick="filterReviews('Venue', this)">Venue</button>
        <button class="filter-btn" onclick="filterReviews('Wedding Package', this)">Packages</button>
    </div>

    <!-- Empty state -->
    <div th:if="${reviews.isEmpty()}" class="empty-state">
        <div class="empty-icon">✦</div>
        <div class="empty-text">No approved reviews yet</div>
        <p style="font-size:0.8rem;color:var(--text-muted);margin-top:8px;">Be the first to share your experience!</p>
        <a href="/reviews/submit" class="btn-gold" style="margin-top:24px;">Write a Review</a>
    </div>

    <!-- Review cards -->
    <div th:each="r : ${reviews}" class="review-card" th:attr="data-service=${r.serviceType}">
        <div class="review-top">
            <div>
                <div class="reviewer-name" th:text="${r.fullName}">Guest</div>
                <div class="review-meta"
                     th:text="${r.vendorName != null and !r.vendorName.isEmpty()} ? ${r.vendorName} + ' · ' + ${r.createdAt} : ${r.createdAt}"></div>
            </div>
            <div class="stars">
                <th:block th:each="i : ${#numbers.sequence(1, r.rating)}">★</th:block>
                <span class="star-empty">
                    <th:block th:each="i : ${#numbers.sequence(r.rating + 1, 5)}">★</th:block>
                </span>
            </div>
        </div>

        <div class="review-service-tag" th:text="${r.serviceType}"></div>

        <div class="review-comment">
            <span class="opening-quote">"</span><span th:text="${r.comment}"></span>"
        </div>
    </div>

    <div class="text-center mt-5">
        <a href="/reviews/submit" class="btn-gold">Share Your Experience →</a>
    </div>
</div>

<script>
    function filterReviews(service, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.review-card').forEach(card => {
            card.style.display =
                (service === 'all' || card.dataset.service === service) ? 'block' : 'none';
        });
    }
</script>

</body>
</html>
