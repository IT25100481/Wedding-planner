<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Review | Vivaha Boutique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c9a84c; --gold-dark: #9a7a2e; --cream: #fdf8f2; --dark: #1a1209; --text-muted: #7a6a50; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--cream); font-family: 'Montserrat', sans-serif; font-weight: 300; min-height: 100vh; }

        .navbar { background: var(--dark); padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; }
        .navbar-brand { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; color: var(--gold); letter-spacing: 3px; text-decoration: none; }
        .nav-link { color: rgba(255,255,255,0.75); font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; margin-left: 24px; }
        .nav-link:hover { color: var(--gold); }

        .hero { background: var(--dark); padding: 60px 0 40px; text-align: center; }
        .hero-tag { font-size: 0.62rem; letter-spacing: 5px; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
        .hero-title { font-family: 'Cormorant Garamond', serif; font-size: 2.8rem; font-weight: 300; color: #fff; }

        .main { max-width: 720px; margin: 60px auto; padding: 0 20px 80px; }

        .form-card { background: #fff; border: 1px solid rgba(201,168,76,0.25); padding: 48px; }
        .form-label { font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; display: block; }
        .form-control, .form-select {
            border: 1px solid rgba(201,168,76,0.3); border-radius: 0;
            font-family: 'Montserrat', sans-serif; font-weight: 300; font-size: 0.9rem;
            padding: 12px 16px; background: #fdfaf5; color: var(--dark);
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,0.1); background: #fff;
        }
        textarea.form-control { min-height: 140px; resize: vertical; }

        /* Star rating widget */
        .star-group { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 6px; }
        .star-group input { display: none; }
        .star-group label {
            font-size: 2rem; color: #d6cfc4; cursor: pointer; transition: color 0.2s;
        }
        .star-group input:checked ~ label,
        .star-group label:hover,
        .star-group label:hover ~ label { color: var(--gold); }

        .btn-gold {
            background: var(--gold); color: var(--dark); border: none; border-radius: 0;
            font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase;
            padding: 14px 40px; font-family: 'Montserrat', sans-serif; font-weight: 600;
            cursor: pointer; transition: background 0.3s;
        }
        .btn-gold:hover { background: var(--gold-dark); }

        .alert-success { background: rgba(201,168,76,0.1); border: 1px solid rgba(201,168,76,0.4); color: var(--dark); border-radius: 0; font-size: 0.85rem; }
        .alert-danger  { border-radius: 0; font-size: 0.85rem; }

        .divider { border: none; border-top: 1px solid rgba(201,168,76,0.2); margin: 32px 0; }
        .back-link { font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); text-decoration: none; }
        .back-link:hover { color: var(--gold-dark); }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <a class="navbar-brand" href="/dashboard">✦ Vivaha Boutique</a>
    <div>
        <a class="nav-link" href="/dashboard">Dashboard</a>
        <a class="nav-link" href="/reviews/my-reviews">My Reviews</a>
        <a class="nav-link" href="/reviews">All Reviews</a>
        <a class="nav-link" href="/logout">Logout</a>
    </div>
</nav>

<!-- HERO -->
<div class="hero">
    <div class="hero-tag">Your Voice Matters</div>
    <div class="hero-title">Share Your Experience</div>
</div>

<!-- MAIN FORM -->
<div class="main">

    <!-- Flash messages -->
    <div th:if="${success}" class="alert alert-success mb-4" th:text="${success}"></div>
    <div th:if="${error}"   class="alert alert-danger mb-4"  th:text="${error}"></div>

    <div class="form-card">
        <form th:action="@{/reviews/submit}" th:object="${review}" method="post">

            <!-- Star Rating -->
            <div class="mb-4">
                <label class="form-label">Your Rating *</label>
                <div class="star-group">
                    <input type="radio" id="s5" name="rating" value="5" th:field="*{rating}"><label for="s5">★</label>
                    <input type="radio" id="s4" name="rating" value="4" th:field="*{rating}"><label for="s4">★</label>
                    <input type="radio" id="s3" name="rating" value="3" th:field="*{rating}"><label for="s3">★</label>
                    <input type="radio" id="s2" name="rating" value="2" th:field="*{rating}"><label for="s2">★</label>
                    <input type="radio" id="s1" name="rating" value="1" th:field="*{rating}"><label for="s1">★</label>
                </div>
            </div>

            <hr class="divider">

            <!-- Service Type -->
            <div class="mb-4">
                <label class="form-label" for="serviceType">Service / Product *</label>
                <select class="form-select" id="serviceType" th:field="*{serviceType}" required>
                    <option value="" disabled selected>Select a service…</option>
                    <option>Photography</option>
                    <option>Videography</option>
                    <option>Catering</option>
                    <option>Floral Decoration</option>
                    <option>Wedding Cake</option>
                    <option>Bridal Makeup</option>
                    <option>Venue</option>
                    <option>DJ / Music</option>
                    <option>Wedding Package</option>
                    <option>Other</option>
                </select>
            </div>

            <!-- Vendor / Provider -->
            <div class="mb-4">
                <label class="form-label" for="vendorName">Vendor / Provider Name</label>
                <input type="text" class="form-control" id="vendorName"
                       th:field="*{vendorName}" placeholder="e.g. Lakshmi Photography Studio">
            </div>

            <!-- Comment -->
            <div class="mb-4">
                <label class="form-label" for="comment">Your Feedback *</label>
                <textarea class="form-control" id="comment" th:field="*{comment}"
                          placeholder="Tell us about your experience…" required></textarea>
            </div>

            <hr class="divider">

            <div class="d-flex align-items-center justify-content-between">
                <a href="/reviews/my-reviews" class="back-link">← Back to My Reviews</a>
                <button type="submit" class="btn-gold">Submit Review</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
