<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard | VIVAHA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold-light: #E5B27D; --dark-chocolate: #1A1209; --white-alpha: rgba(255, 255, 255, 0.1); }
        body { background-color: var(--dark-chocolate); color: white; font-family: 'Montserrat', sans-serif; margin: 0; }
        .dashboard-nav { background: rgba(26, 18, 9, 0.98); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(229, 178, 125, 0.2); position: sticky; top: 0; z-index: 1000; }
        .brand-text { font-family: "Cormorant Garamond", serif; font-size: 2.2rem; color: var(--gold-light); letter-spacing: 2px; }
        .nav-links { display: flex; gap: 30px; align-items: center; }
        .nav-links a { text-decoration: none; color: rgba(255,255,255,0.7); font-size: 0.75rem; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; }
        .nav-links a.active { color: var(--gold-light); border-bottom: 1px solid var(--gold-light); padding-bottom: 5px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; padding: 50px 5%; }
        .service-card { background: #231A11; border: 1px solid var(--white-alpha); transition: 0.4s ease; position: relative; min-height: 350px; cursor: pointer; overflow: hidden; }
        .service-card:hover { border-color: var(--gold-light); transform: translateY(-5px); }
        .card-img-layer { height: 200px; background-size: cover; background-position: center; border-bottom: 1px solid var(--white-alpha); }
        .card-content { padding: 25px; }
        .card-cat { font-size: 0.65rem; color: var(--gold-light); letter-spacing: 2px; text-transform: uppercase; }
        .card-title { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; margin: 5px 0; font-weight: 300; }
        .add-card { border: 1px dashed var(--gold-light); display: flex; align-items: center; justify-content: center; text-align: center; }
        .modal-content { background: var(--dark-chocolate); border: 1px solid var(--gold-light); color: white; border-radius: 0; }
        .btn-luxury-gold { background: var(--gold-light); color: var(--dark-chocolate); border: none; padding: 15px; width: 100%; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
        input, select, textarea { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--white-alpha); color: white; padding: 10px 0; margin-bottom: 20px; }
        .drop-zone { border: 1px dashed var(--white-alpha); padding: 30px; text-align: center; cursor: pointer; }
        #preview-img { max-width: 100%; height: 120px; display: none; margin: 10px auto; border: 1px solid var(--gold-light); }
    </style>
</head>
<body>

<nav class="dashboard-nav">
    <span class="brand-text">Vivaha</span>
    <div class="nav-links">
        <a href="/vendor/dashboard" class="active">SERVICES</a>
        <a href="/vendor/bookings">BOOKINGS</a>
        <a href="/vendor/messages">INQUIRIES</a>
    </div>
    <div class="nav-links">
        <a href="/logout" style="color: #c0392b;">LOGOUT</a>
    </div>
</nav>

<div class="grid-container">
    <div class="service-card add-card" onclick="openAddModal()">
        <div><i class="bi bi-plus-lg" style="font-size: 3rem; color: var(--gold-light);"></i><p class="card-cat">Add New Service</p></div>
    </div>

    <div th:each="service : ${services}" class="service-card"
         th:data-id="${service.id}"
         th:data-name="${service.businessName}"
         th:data-category="${service.category}"
         th:data-tradition="${service.tradition}"
         th:data-price="${service.price}"
         th:data-description="${service.description}"
         th:data-contact="${service.contact}"
         onclick="openEditModalFromCard(this)">

        <div class="card-img-layer" th:style="'background-image: url(/uploads/' + ${service.imagePath} + ');'"></div>
        <div class="card-content">
            <span class="card-cat" th:text="${service.category} + ' | ' + ${service.tradition}"></span>
            <h3 class="card-title" th:text="${service.businessName}"></h3>
            <span style="color: var(--gold-light);" th:text="${service.price + ' LKR'}"></span>
            <div class="mt-4">
                <a th:href="@{'/vendor/delete/' + ${service.id}}"
                   style="color: #c0392b; font-size: 0.65rem; text-decoration: none; font-weight: 600;"
                   onclick="event.stopPropagation(); return confirm('Remove this service?')">REMOVE</a>
            </div>
        </div>
    </div>
</div>

<!-- ADD MODAL -->
<div id="addModal" class="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:2000;">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4">
            <h2 style="font-family: 'Cormorant Garamond'; text-align: center;">New Service</h2>
            <form th:action="@{/vendor/add-service}" method="post" enctype="multipart/form-data">
                <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
                    <span id="drop-text" class="card-cat">Click to Upload Image</span>
                    <input type="file" name="imageFile" id="fileInput" hidden accept="image/*">
                    <img id="preview-img" src="">
                </div>
                <input type="text" name="businessName" placeholder="BUSINESS NAME" required>
                <div class="row">
                    <div class="col-6">
                        <select name="category" required>
                            <option value="Photography">Photography</option>
                            <option value="Cakes">Cakes</option>
                            <option value="Venue">Venue</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <select name="tradition" required>
                            <option value="Sinhalese">Sinhalese</option>
                            <option value="Hindu">Hindu</option>
                            <option value="Muslim">Muslim</option>
                            <option value="Christian">Christian</option>
                        </select>
                    </div>
                </div>
                <input type="text" name="price" placeholder="PRICE (LKR)" required>
                <input type="text" name="contact" placeholder="CONTACT NUMBER" required>
                <textarea name="description" placeholder="DESCRIPTION" rows="2"></textarea>
                <button type="submit" class="btn-luxury-gold">SAVE SERVICE</button>
                <button type="button" onclick="closeAddModal()" class="btn btn-link text-white w-100 mt-2">CANCEL</button>
            </form>
        </div>
    </div>
</div>

<!-- EDIT MODAL -->
<div id="editModal" class="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:2000;">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4">
            <h2 style="font-family: 'Cormorant Garamond'; text-align: center;">Edit Service</h2>
            <form th:action="@{/vendor/update}" method="post">
                <input type="hidden" name="id" id="edit-id">
                <input type="text" name="businessName" id="edit-name" required>
                <div class="row">
                    <div class="col-6">
                        <select name="category" id="edit-category">
                            <option value="Photography">Photography</option>
                            <option value="Cakes">Cakes</option>
                            <option value="Venue">Venue</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <select name="tradition" id="edit-tradition">
                            <option value="Sinhalese">Sinhalese</option>
                            <option value="Hindu">Hindu</option>
                            <option value="Muslim">Muslim</option>
                            <option value="Christian">Christian</option>
                        </select>
                    </div>
                </div>
                <input type="text" name="price" id="edit-price" required>
                <input type="text" name="contact" id="edit-contact" required>
                <textarea name="description" id="edit-desc" rows="2"></textarea>
                <button type="submit" class="btn-luxury-gold">UPDATE CHANGES</button>
                <button type="button" onclick="closeEditModal()" class="btn btn-link text-white w-100 mt-2">CANCEL</button>
            </form>
        </div>
    </div>
</div>

<script>
    function openAddModal() { document.getElementById('addModal').style.display='block'; }
    function closeAddModal() { document.getElementById('addModal').style.display='none'; }
    function closeEditModal() { document.getElementById('editModal').style.display='none'; }

    function openEditModalFromCard(element) {
        document.getElementById('edit-id').value = element.getAttribute('data-id');
        document.getElementById('edit-name').value = element.getAttribute('data-name');
        document.getElementById('edit-category').value = element.getAttribute('data-category');
        document.getElementById('edit-tradition').value = element.getAttribute('data-tradition');
        document.getElementById('edit-price').value = element.getAttribute('data-price');
        document.getElementById('edit-contact').value = element.getAttribute('data-contact');
        document.getElementById('edit-desc').value = element.getAttribute('data-description');
        document.getElementById('editModal').style.display = 'block';
    }

    document.getElementById("fileInput").onchange = function() {
        const reader = new FileReader();
        reader.onload = (e) => {
            const preview = document.getElementById("preview-img");
            preview.src = e.target.result;
            preview.style.display = "block";
            document.getElementById("drop-text").style.display = "none";
        };
        reader.readAsDataURL(this.files[0]);
    };
</script>
</body>
</html>
