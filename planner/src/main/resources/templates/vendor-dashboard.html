<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vendor Dashboard | Kik Plus</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <!-- Font Awesome for the Profile Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --dusty-rose: #D4A5A5; --cream: #F5F1E8; --dark-grey: #333; }
        body { background-color: var(--cream); font-family: 'Montserrat', sans-serif; margin: 0; }

        /* Updated Nav Bar Styles */
        .dashboard-nav {
            background: #fff;
            padding: 10px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-links { display: flex; gap: 25px; align-items: center; }
        .nav-links a {
            text-decoration: none;
            color: var(--dark-grey);
            font-size: 0.85rem;
            font-weight: 500;
            transition: 0.3s;
        }
        .nav-links a:hover { color: var(--dusty-rose); }
        .nav-links a.active { color: var(--dusty-rose); border-bottom: 2px solid var(--dusty-rose); }

        /* Profile Dropdown Styles */
        .profile-menu { position: relative; display: inline-block; }
        .profile-icon {
            font-size: 1.5rem;
            color: var(--dark-grey);
            cursor: pointer;
            padding: 5px;
            transition: 0.3s;
        }
        .profile-icon:hover { color: var(--dusty-rose); }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: #fff;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.1);
            border-radius: 8px;
            z-index: 1;
            overflow: hidden;
        }
        .dropdown-content a {
            color: var(--dark-grey);
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 0.8rem;
        }
        .dropdown-content a:hover { background-color: #f8f8f8; color: var(--dusty-rose); }
        .profile-menu:hover .dropdown-content { display: block; }

        /* Original Grid & Card Styles */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; padding: 50px 5%; }
        .service-card {
            background-color: #FFE4E1;
            background-size: cover;
            background-position: center;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            transition: 0.3s;
            position: relative;
            min-height: 220px;
            cursor: pointer;
            overflow: hidden;
        }
        .card-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.6);
            z-index: 1;
        }
        .card-content { position: relative; z-index: 2; padding: 20px; }

        /* Form & Modal Styles */
        .drop-zone {
            border: 2px dashed var(--dusty-rose);
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 15px;
            cursor: pointer;
            background: #fff;
        }
        .drop-zone--over { background: #fdf2f2; border-style: solid; }
        #preview-img { max-width: 100%; height: 100px; display: none; margin-top: 10px; border-radius: 5px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; overflow-y: auto; }
        .modal-content { background: white; width: 90%; max-width: 450px; margin: 50px auto; padding: 30px; border-radius: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 5px; color: #777; font-weight: 600; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-primary { background: var(--dusty-rose); color: white; border: none; padding: 12px; width: 100%; border-radius: 50px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

<nav class="dashboard-nav">
    <span class="brand" style="font-family: 'Cormorant Garamond'; font-size: 1.8rem; font-weight: bold;">KIK PLUS</span>

    <!-- Central Navigation Links -->
    <div class="nav-links">
        <a href="/vendor/dashboard" class="active">SERVICES</a>
        <a href="/vendor/payments">PAYMENTS</a>
        <a href="/vendor/bookings">BOOKINGS</a>
        <a href="/vendor/messages">INQUIRIES</a>
    </div>

    <!-- Right Side Profile Menu -->
    <div class="profile-menu">
        <div class="profile-icon">
            <i class="fa-regular fa-circle-user"></i>
        </div>
        <div class="dropdown-content">
            <a href="/vendor/profile"><i class="fa-solid fa-user-pen me-2"></i> Edit Profile</a>
            <a href="/" style="color: #c0392b;"><i class="fa-solid fa-right-from-bracket me-2"></i> Logout</a>
        </div>
    </div>
</nav>

<div class="grid-container">
    <!-- ADD SERVICE CARD -->
    <div class="service-card" style="display: flex; align-items: center; justify-content: center; border: 2px dashed var(--dusty-rose); background: none;" onclick="openAddModal()">
        <div style="text-align: center;">
            <span style="font-size: 3rem; color: var(--dusty-rose);">+</span>
            <p>Add New Service</p>
        </div>
    </div>

    <!-- EXISTING SERVICES -->
    <div th:each="service : ${services}"
         class="service-card"
         th:style="${service.imagePath != null} ? 'background-image: url(/uploads/' + ${service.imagePath} + ');' : ''"
         th:onclick="openEditModal([[${service.id}]], [[${service.businessName}]], [[${service.category}]], [[${service.tradition}]], [[${service.price}]], [[${service.description}]], [[${service.contact}]])">

        <div th:if="${service.imagePath != null}" class="card-overlay"></div>
        <div class="card-content">
            <h3 th:text="${service.businessName}" style="font-family: 'Cormorant Garamond'; margin: 0;"></h3>
            <p style="font-size: 0.8rem; color: #555;">
                <span th:text="${service.category}"></span> | <span th:text="${service.tradition}"></span>
            </p>
            <p th:text="${service.price + ' LKR'}" style="font-weight: bold; margin-top: 15px;"></p>
            <a th:href="@{'/vendor/delete/' + ${service.id}}" style="color: #c0392b; font-size: 0.7rem; text-decoration: none; font-weight: bold;" onclick="event.stopPropagation(); return confirm('Delete this service?')">REMOVE</a>
        </div>
    </div>
</div>

<!-- ADD MODAL -->
<div id="addModal" class="modal">
    <div class="modal-content">
        <h2 style="font-family: 'Cormorant Garamond'; text-align: center;">New Service</h2>
        <form th:action="@{/vendor/add-service}" method="post" enctype="multipart/form-data">
            <div class="drop-zone" id="dropZone">
                <span id="drop-text">Drag Image Here or Click</span>
                <input type="file" name="imageFile" id="fileInput" hidden accept="image/*">
                <img id="preview-img" src="">
            </div>
            <div class="form-group"><input type="text" name="businessName" placeholder="Business Name" required></div>
            <div class="form-group">
                <select name="category" required>
                    <option value="Photography">Photography</option>
                    <option value="Cakes">Cakes</option>
                    <option value="Venue">Venue</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <select name="tradition" required>
                    <option value="Sinhalese">Sinhalese</option>
                    <option value="Hindu">Hindu</option>
                    <option value="Muslim">Muslim</option>
                    <option value="Christian">Christian</option>
                    <option value="Universal/Mixed">Universal/Mixed</option>
                </select>
            </div>
            <div class="form-group"><input type="text" name="price" placeholder="Price (LKR)" required></div>
            <div class="form-group"><input type="text" name="contact" placeholder="Contact Number" required></div>
            <div class="form-group"><textarea name="description" placeholder="Description"></textarea></div>
            <button type="submit" class="btn-primary">SAVE SERVICE</button>
            <button type="button" onclick="closeAddModal()" style="width:100%; background:none; border:none; margin-top:10px; cursor:pointer;">Cancel</button>
        </form>
    </div>
</div>

<!-- EDIT MODAL -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <h2 style="font-family: 'Cormorant Garamond'; text-align: center;">Edit Service</h2>
        <form th:action="@{/vendor/update}" method="post">
            <input type="hidden" name="id" id="edit-id">
            <div class="form-group"><label>Business Name</label><input type="text" name="businessName" id="edit-name" required></div>
            <div class="form-group">
                <label>Category</label>
                <select name="category" id="edit-category" required>
                    <option value="Photography">Photography</option>
                    <option value="Cakes">Cakes</option>
                    <option value="Venue">Venue</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Tradition</label>
                <select name="tradition" id="edit-tradition" required>
                    <option value="Sinhalese">Sinhalese</option>
                    <option value="Hindu">Hindu</option>
                    <option value="Muslim">Muslim</option>
                    <option value="Christian">Christian</option>
                    <option value="Universal/Mixed">Universal/Mixed</option>
                </select>
            </div>
            <div class="form-group"><label>Price (LKR)</label><input type="text" name="price" id="edit-price" required></div>
            <div class="form-group"><label>Contact</label><input type="text" name="contact" id="edit-contact" required></div>
            <div class="form-group"><label>Description</label><textarea name="description" id="edit-desc"></textarea></div>
            <button type="submit" class="btn-primary">UPDATE CHANGES</button>
            <button type="button" onclick="closeEditModal()" style="width:100%; background:none; border:none; margin-top:10px; cursor:pointer;">Close</button>
        </form>
    </div>
</div>

<script>
    function openAddModal() { document.getElementById('addModal').style.display='block'; }
    function closeAddModal() { document.getElementById('addModal').style.display='none'; }
    function closeEditModal() { document.getElementById('editModal').style.display='none'; }

    function openEditModal(id, name, cat, trad, price, desc, contact) {
        document.getElementById('edit-id').value = id;
        document.getElementById('edit-name').value = name;
        document.getElementById('edit-category').value = cat;
        document.getElementById('edit-tradition').value = trad;
        document.getElementById('edit-price').value = price;
        document.getElementById('edit-contact').value = contact;
        document.getElementById('edit-desc').value = desc;
        document.getElementById('editModal').style.display = 'block';
    }

    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const preview = document.getElementById("preview-img");
    const dropText = document.getElementById("drop-text");

    dropZone.onclick = () => fileInput.click();
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add("drop-zone--over"); };
    dropZone.ondragleave = () => dropZone.classList.remove("drop-zone--over");
    dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.classList.remove("drop-zone--over");
        if (e.dataTransfer.files.length) {
            fileInput.files = e.dataTransfer.files;
            showPreview(e.dataTransfer.files[0]);
        }
    };
    fileInput.onchange = () => { if(fileInput.files.length) showPreview(fileInput.files[0]); };

    function showPreview(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            preview.src = e.target.result;
            preview.style.display = "block";
            dropText.style.display = "none";
        };
        reader.readAsDataURL(file);
    }

    // Close dropdown if clicked outside
    window.onclick = function(event) {
        if (!event.target.matches('.fa-circle-user') && !event.target.matches('.profile-icon')) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            for (var i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                if (openDropdown.style.display === "block") {
                    openDropdown.style.display = "none";
                }
            }
        }
    }
</script>
</body>
</html>
